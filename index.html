<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicer — Озвучення ElevenLabs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .voice-card { transition: all 0.2s; }
    .voice-card:hover { transform: scale(1.05); }
    .selected { border: 3px solid #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.3); }
    .accent-emerald { accent-color: #10b981; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div class="max-w-7xl mx-auto p-6">
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-waveform text-4xl text-emerald-500"></i>
      <h1 class="text-3xl font-bold">Voicer — ElevenLabs</h1>
    </div>
    <div onclick="showTokenModal()" class="flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 px-5 py-2 rounded-2xl cursor-pointer border border-zinc-700">
      <i class="fa-solid fa-key"></i>
      <span id="tokenStatus" class="text-sm font-medium">API токен</span>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- SIDEBAR — CUSTOM VOICE -->
    <div class="lg:col-span-3 bg-zinc-900 rounded-3xl p-6 h-fit">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-microphone"></i> Voice ID</h2>
      
      <div class="space-y-4">
        <div>
          <p class="text-xs text-zinc-400 mb-2">Встав voice_id з ElevenLabs</p>
          <div class="flex gap-2">
            <input id="customVoiceId" type="text" placeholder="наприклад: pNInz6obpgDQGcFmaJgB" 
                   class="flex-1 bg-zinc-800 rounded-2xl px-4 py-3 outline-none text-sm">
            <button onclick="useCustomVoice()" 
                    class="bg-emerald-600 hover:bg-emerald-700 px-6 rounded-2xl text-sm font-medium">Використати</button>
          </div>
          <div id="customStatus" class="text-xs mt-3 text-emerald-400"></div>
        </div>
      </div>
    </div>

    <!-- MAIN AREA -->
    <div class="lg:col-span-6 space-y-6">
      <!-- Текст -->
      <div class="bg-zinc-900 rounded-3xl p-6">
        <div class="flex justify-between mb-2">
          <label class="font-medium">Ваш текст</label>
          <span id="charCount" class="text-zinc-400 text-sm">0 / 1 000 000</span>
        </div>
        <textarea id="textInput" rows="8" class="w-full bg-zinc-800 rounded-2xl p-5 outline-none resize-none text-lg" placeholder="Вставте текст для озвучення..."></textarea>
      </div>

      <div class="flex gap-4">
        <button onclick="synthesize()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 py-6 text-2xl font-semibold rounded-3xl transition">
          <i class="fa-solid fa-play mr-3"></i> ОЗВУЧИТИ
        </button>
        <button onclick="clearAll()" class="px-8 bg-zinc-800 hover:bg-zinc-700 rounded-3xl text-xl"><i class="fa-solid fa-trash"></i></button>
      </div>

      <div id="playerContainer" class="hidden bg-zinc-900 rounded-3xl p-6">
        <audio id="audioPlayer" controls class="w-full"></audio>
        <div class="flex gap-3 mt-4">
          <button onclick="downloadCurrent()" class="flex-1 bg-zinc-800 hover:bg-emerald-600 py-4 rounded-2xl flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i> Завантажити MP3</button>
          <button onclick="hidePlayer()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl">Закрити</button>
        </div>
      </div>
      <div id="status" class="text-center text-sm text-zinc-400 min-h-[28px]"></div>
    </div>

    <!-- ПРАВА ПАНЕЛЬ -->
    <div class="lg:col-span-3 space-y-6">
      <div class="bg-zinc-900 rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-4">Налаштування</h2>
        <div class="space-y-6">
          <!-- Модель -->
          <div>
            <label class="block text-sm mb-1">Модель</label>
            <select id="modelSelect" class="w-full bg-zinc-800 rounded-2xl px-4 py-3 outline-none">
              <option value="eleven_v3">🌟 Eleven v3 (найновіша)</option>
              <option value="eleven_multilingual_v2">🌍 Multilingual v2</option>
              <option value="eleven_turbo_v2_5">⚡ Turbo v2.5</option>
              <option value="eleven_flash_v2_5">⚡ Flash v2.5</option>
            </select>
          </div>

          <!-- Voice Settings -->
          <div class="space-y-5">
            <div>
              <label class="block text-sm mb-1">Stability <span id="stabilityVal" class="text-emerald-400">0.75</span></label>
              <input type="range" id="stability" min="0" max="1" step="0.05" value="0.75" class="w-full accent-emerald">
            </div>
            <div>
              <label class="block text-sm mb-1">Similarity Boost <span id="similarityVal" class="text-emerald-400">0.85</span></label>
              <input type="range" id="similarity" min="0" max="1" step="0.05" value="0.85" class="w-full accent-emerald">
            </div>
            <div>
              <label class="block text-sm mb-1">Style Exaggeration <span id="styleVal" class="text-emerald-400">0.0</span></label>
              <input type="range" id="style" min="0" max="1" step="0.05" value="0.0" class="w-full accent-emerald">
            </div>
            <div>
              <label class="block text-sm mb-1">Speed <span id="speedVal" class="text-emerald-400">1.0</span></label>
              <input type="range" id="speed" min="0.5" max="2.0" step="0.05" value="1.0" class="w-full accent-emerald">
            </div>
          </div>

          <!-- Авто-паузи -->
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="autoPause" checked class="w-5 h-5 accent-emerald"><span>Авто-паузи</span></label>
            <div class="flex items-center gap-2">
              <input id="pauseDuration" type="number" value="1.2" step="0.1" min="0.1" max="30" class="w-20 bg-zinc-800 rounded-xl px-3 py-1 text-center">
              <span class="text-sm text-zinc-400">сек</span>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-zinc-900 rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-4">Історія (тимчасова)</h2>
        <div id="historyList" class="space-y-3 max-h-96 overflow-y-auto"></div>
        <button onclick="clearHistory()" class="mt-4 text-xs text-red-400 hover:text-red-300">Очистити історію</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL ТОКЕН -->
<div id="tokenModal" onclick="if(event.target===this)hideTokenModal()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div onclick="event.stopImmediatePropagation()" class="bg-zinc-900 rounded-3xl p-8 w-full max-w-md">
    <h3 class="text-2xl font-bold mb-6">Ваш API токен</h3>
    <input id="tokenInput" type="password" placeholder="sk_..." class="w-full bg-zinc-800 rounded-2xl px-5 py-4 text-lg outline-none mb-6">
    <button onclick="saveToken()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-5 text-xl font-semibold rounded-2xl">Зберегти токен</button>
  </div>
</div>

<script>
// ================== Глобальні змінні ==================
let currentToken = '';
let history = [];
let currentBlobUrl = null;
let selectedVoiceId = '';           // тільки ID
let currentTaskId = null;

// ================== Функції токена ==================
function updateTokenStatus() {
  const status = document.getElementById('tokenStatus');
  status.textContent = currentToken ? 'Токен збережено ✓' : 'Ввести токен';
  status.className = currentToken ? 'text-sm font-medium text-emerald-400' : 'text-sm font-medium text-zinc-400';
}

function showTokenModal() {
  document.getElementById('tokenModal').classList.remove('hidden');
  document.getElementById('tokenInput').focus();
}

function hideTokenModal() {
  document.getElementById('tokenModal').classList.add('hidden');
}

function saveToken() {
  currentToken = document.getElementById('tokenInput').value.trim();
  hideTokenModal();
  updateTokenStatus();
  if (!currentToken) alert('Токен не введено');
}

// ================== Custom Voice ==================
function useCustomVoice() {
  const id = document.getElementById('customVoiceId').value.trim();
  if (!id) return alert('Введіть voice_id');

  selectedVoiceId = id;
  document.getElementById('customStatus').innerHTML = `✅ Використовується voice_id:<br><span class="font-mono text-emerald-300">${id}</span>`;
}

// ================== Синтез ==================
async function synthesize() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) return alert('Введіть текст для озвучення');
  if (!selectedVoiceId) return alert('Вкажіть Voice ID');
  if (!currentToken) return alert('Введіть API токен');

  const status = document.getElementById('status');
  status.textContent = 'Генерація...';

  const model = document.getElementById('modelSelect').value;
  const stability = parseFloat(document.getElementById('stability').value);
  const similarity = parseFloat(document.getElementById('similarity').value);
  const style = parseFloat(document.getElementById('style').value);
  const speed = parseFloat(document.getElementById('speed').value);

  const payload = {
    text: text,
    voice_id: selectedVoiceId,
    model_id: model,
    voice_settings: {
      stability: stability,
      similarity_boost: similarity,
      style: style,
      speed: speed
    },
    auto_pause_enabled: document.getElementById('autoPause').checked,
    auto_pause_duration: parseFloat(document.getElementById('pauseDuration').value)
  };

  try {
    const res = await fetch('https://voicer.mat3u.com/api/v1/voice/synthesize', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${currentToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    if (data.task_id) {
      currentTaskId = data.task_id;
      status.textContent = 'Обробка... (чекаємо результат)';
      startPolling();
    } else {
      status.textContent = 'Помилка: ' + (data.error || 'невідома');
    }
  } catch (e) {
    status.textContent = 'Помилка запиту';
    console.error(e);
  }
}

async function startPolling() {
  const interval = setInterval(async () => {
    try {
      const res = await fetch(`https://voicer.mat3u.com/api/v1/voice/status/${currentTaskId}`, {
        headers: { 'Authorization': `Bearer ${currentToken}` }
      });
      const data = await res.json();

      if (data.status === 'completed') {
        clearInterval(interval);
        playAudio(currentTaskId);
      } else if (data.status === 'failed' || data.status === 'censored') {
        clearInterval(interval);
        document.getElementById('status').textContent = 'Помилка або цензура';
      }
    } catch (e) {}
  }, 2500);
}

async function playAudio(taskId) {
  const res = await fetch(`https://voicer.mat3u.com/api/v1/voice/download/${taskId}`, {
    headers: { 'Authorization': `Bearer ${currentToken}` }
  });
  const blob = await res.blob();
  currentBlobUrl = URL.createObjectURL(blob);

  const playerContainer = document.getElementById('playerContainer');
  const audio = document.getElementById('audioPlayer');
  audio.src = currentBlobUrl;
  playerContainer.classList.remove('hidden');
  audio.play();

  document.getElementById('status').textContent = 'Готово!';
  addToHistory(taskId);
}

function downloadCurrent() {
  if (!currentBlobUrl) return;
  const a = document.createElement('a');
  a.href = currentBlobUrl;
  a.download = `voice_${Date.now()}.mp3`;
  a.click();
}

// ================== Історія ==================
function addToHistory(taskId) {
  history.unshift({ taskId, time: new Date().toLocaleTimeString(), voice: selectedVoiceId });
  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = '';
  history.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'bg-zinc-800 rounded-2xl p-3 text-sm cursor-pointer hover:bg-zinc-700';
    div.innerHTML = `<span class="text-emerald-400">${item.time}</span> — ${item.voice.substring(0,12)}...`;
    div.onclick = () => replayHistory(i);
    container.appendChild(div);
  });
}

async function replayHistory(index) {
  const item = history[index];
  if (!item) return;
  currentTaskId = item.taskId;
  playAudio(item.taskId);
}

function clearHistory() {
  if (confirm('Очистити всю історію?')) {
    history = [];
    renderHistory();
  }
}

// ================== Допоміжні функції ==================
function hidePlayer() {
  document.getElementById('playerContainer').classList.add('hidden');
}

function clearAll() {
  document.getElementById('textInput').value = '';
  document.getElementById('charCount').textContent = '0 / 1 000 000';
  hidePlayer();
}

// ================== Ініціалізація ==================
document.addEventListener('DOMContentLoaded', () => {
  updateTokenStatus();

  const ta = document.getElementById('textInput');
  ta.addEventListener('input', () => {
    document.getElementById('charCount').textContent = `${ta.value.length} / 1 000 000`;
  });

  // Оновлення значень слайдерів у реальному часі
  const sliders = ['stability', 'similarity', 'style', 'speed'];
  sliders.forEach(id => {
    const el = document.getElementById(id);
    const val = document.getElementById(id + 'Val');
    el.oninput = () => val.textContent = parseFloat(el.value).toFixed(2);
  });

  // Початкове значення custom status
  document.getElementById('customStatus').innerHTML = 'Введіть voice_id вище';
});
</script>
</body>
</html>
