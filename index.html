<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicer — Всі голоси ElevenLabs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .voice-card { transition: all 0.2s; }
    .voice-card:hover { transform: scale(1.05); }
    .selected { border: 3px solid #a855f7; box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.3); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<div class="max-w-7xl mx-auto p-6">
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-waveform text-4xl text-purple-500"></i>
      <h1 class="text-3xl font-bold">Voicer — Всі голоси</h1>
    </div>
    <div onclick="showTokenModal()" class="flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 px-5 py-2 rounded-2xl cursor-pointer border border-zinc-700">
      <i class="fa-solid fa-key"></i>
      <span id="tokenStatus" class="text-sm font-medium">API токен</span>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- SIDEBAR — ГОЛОСИ -->
    <div class="lg:col-span-3 bg-zinc-900 rounded-3xl p-5 h-fit">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-microphone"></i> Голоси ElevenLabs</h2>
      
      <input id="voiceSearch" type="text" placeholder="Пошук голосу або ID..." 
             class="w-full bg-zinc-800 text-white rounded-2xl px-4 py-3 mb-4 outline-none focus:ring-2 focus:ring-purple-500"
             onkeyup="filterVoices()">

      <div id="voicesGrid" class="grid grid-cols-2 gap-3 max-h-[55vh] overflow-y-auto pr-2"></div>

      <!-- CUSTOM VOICE -->
      <div class="mt-6 pt-6 border-t border-zinc-700">
        <h3 class="text-sm font-medium mb-2">Custom Voice ID</h3>
        <p class="text-xs text-zinc-400 mb-3">Встав voice_id зі свого ElevenLabs акаунту</p>
        <div class="flex gap-2">
          <input id="customVoiceId" type="text" placeholder="наприклад: pNInz6obpgDQGcFmaJgB"
                 class="flex-1 bg-zinc-800 rounded-2xl px-4 py-3 outline-none text-sm">
          <button onclick="useCustomVoice()" 
                  class="bg-purple-600 hover:bg-purple-700 px-6 rounded-2xl text-sm font-medium">Використати</button>
        </div>
        <div id="customStatus" class="text-xs mt-2 text-emerald-400"></div>
      </div>
    </div>

    <!-- MAIN AREA -->
    <div class="lg:col-span-6 space-y-6">
      <!-- Текст -->
      <div class="bg-zinc-900 rounded-3xl p-6">
        <div class="flex justify-between mb-2">
          <label class="font-medium">Ваш текст</label>
          <span id="charCount" class="text-zinc-400 text-sm">0 / 1 000 000</span>
        </div>
        <textarea id="textInput" rows="8" class="w-full bg-zinc-800 rounded-2xl p-5 outline-none resize-none text-lg" placeholder="Вставте текст..."></textarea>
      </div>

      <div class="flex gap-4">
        <button onclick="synthesize()" class="flex-1 bg-gradient-to-r from-purple-600 to-violet-600 hover:from-purple-700 hover:to-violet-700 py-6 text-2xl font-semibold rounded-3xl transition">
          <i class="fa-solid fa-play mr-3"></i> ОЗВУЧИТИ
        </button>
        <button onclick="clearAll()" class="px-8 bg-zinc-800 hover:bg-zinc-700 rounded-3xl text-xl"><i class="fa-solid fa-trash"></i></button>
      </div>

      <div id="playerContainer" class="hidden bg-zinc-900 rounded-3xl p-6">
        <audio id="audioPlayer" controls class="w-full"></audio>
        <div class="flex gap-3 mt-4">
          <button onclick="downloadCurrent()" class="flex-1 bg-zinc-800 hover:bg-emerald-600 py-4 rounded-2xl flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i> Завантажити MP3</button>
          <button onclick="hidePlayer()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl">Закрити</button>
        </div>
      </div>

      <div id="status" class="text-center text-sm text-zinc-400 min-h-[28px]"></div>
    </div>

    <!-- ПРАВА ПАНЕЛЬ -->
    <div class="lg:col-span-3 space-y-6">
      <div class="bg-zinc-900 rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-4">Налаштування</h2>
        <!-- ті самі налаштування як раніше (модель, stability, similarity, auto-pause) -->
        <div class="space-y-5">
          <div>
            <label class="block text-sm mb-1">Модель</label>
            <select id="modelSelect" class="w-full bg-zinc-800 rounded-2xl px-4 py-3 outline-none">
              <option value="eleven_multilingual_v2">🌍 Multilingual v2 (найкраща)</option>
              <option value="eleven_turbo_v2_5">⚡ Turbo v2.5</option>
              <option value="eleven_flash_v2_5">⚡ Flash v2.5</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm mb-1">Stability <span id="stabilityVal" class="text-purple-400">0.75</span></label>
              <input type="range" id="stability" min="0" max="1" step="0.05" value="0.75" class="w-full accent-purple-500">
            </div>
            <div>
              <label class="block text-sm mb-1">Similarity <span id="similarityVal" class="text-purple-400">0.85</span></label>
              <input type="range" id="similarity" min="0" max="1" step="0.05" value="0.85" class="w-full accent-purple-500">
            </div>
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="autoPause" checked class="w-5 h-5 accent-purple-500"><span>Авто-паузи</span></label>
            <input id="pauseDuration" type="number" value="1.2" step="0.1" class="w-16 bg-zinc-800 rounded-xl px-3 py-1 text-center"> <span class="text-sm text-zinc-400">сек</span>
          </div>
        </div>
      </div>

      <div class="bg-zinc-900 rounded-3xl p-6">
        <h2 class="text-xl font-semibold mb-4">Історія (тимчасова)</h2>
        <div id="historyList" class="space-y-3 max-h-96 overflow-y-auto"></div>
        <button onclick="clearHistory()" class="mt-4 text-xs text-red-400 hover:text-red-300">Очистити історію</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL ТОКЕН (той самий) -->
<div id="tokenModal" onclick="if(event.target===this)hideTokenModal()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div onclick="event.stopImmediatePropagation()" class="bg-zinc-900 rounded-3xl p-8 w-full max-w-md">
    <h3 class="text-2xl font-bold mb-6">Ваш API токен</h3>
    <input id="tokenInput" type="password" placeholder="sk_..." class="w-full bg-zinc-800 rounded-2xl px-5 py-4 text-lg outline-none mb-6">
    <button onclick="saveToken()" class="w-full bg-purple-600 hover:bg-purple-700 py-5 text-xl font-semibold rounded-2xl">Зберегти токен</button>
  </div>
</div>

<script>
// ================== ВЕЛИКИЙ СПИСОК ГОЛОСІВ ==================
const voicesDB = [
  {id:"21m00Tcm4TlvDq8ikWAM", name:"Rachel", desc:"Жіночий класичний", emoji:"👩"},
  {id:"EXAVITQu4vr4xnSDxMaL", name:"Bella", desc:"Жіночий теплий", emoji:"👩"},
  {id:"ErXwobaYiN019PkySvjV", name:"Antoni", desc:"Чоловічий енергійний", emoji:"🧔"},
  {id:"pNInz6obpgDQGcFmaJgB", name:"Adam", desc:"Чоловічий глибокий", emoji:"🧔"},
  {id:"AZnzlk1XvdvUeBnXmlld", name:"Domi", desc:"Жіночий динамічний", emoji:"👩"},
  {id:"VR6AewLTigWG4xSOukaG", name:"Arnold", desc:"Чоловічий сильний", emoji:"🧔"},
  {id:"yoZ06aMxZJJ28mfd3POQ", name:"Sam", desc:"Чоловічий дружній", emoji:"🧔"},
  {id:"ThT5KcBeYPXvke4nZqZf", name:"Rachel (old)", desc:"Класичний", emoji:"👩"},
  {id:"Xb7hH8MSUJpSbSDYk0k2", name:"Alice", desc:"Британський жіночий", emoji:"👩"},
  {id:"iP95p4xoKVk53GoZ742B", name:"Chris", desc:"Чоловічий спокійний", emoji:"🧔"},
  {id:"2EiwWnXFnvU5JabPnv8n", name:"Clyde", desc:"Чоловічий низький", emoji:"🧔"},
  {id:"XB0fDUnXU5powFXDhCwa", name:"Charlotte", desc:"Жіночий британський", emoji:"👩"},
  {id:"MF3mGyEYCl7XYWbV9V6O", name:"Elli", desc:"Жіночий молодий", emoji:"👩"},
  {id:"JBFqnCBsd6RMkjVDRZzb", name:"Grace", desc:"Жіночий ніжний", emoji:"👩"},
  {id:"N2lVS1w4EtoT3dr4eOWO", name:"Daniel", desc:"Чоловічий британський", emoji:"🧔"},
  {id:"TX3LPg2cNq9XzqE0f2X7", name:"Michael", desc:"Чоловічий авторитетний", emoji:"🧔"},
  {id:"9BWtsX7f2qX9vP3mL5kR", name:"Daniel", desc:"Авторитетний", emoji:"🧔"},
  // ще 15+ популярних (можу додати ще, якщо треба)
  {id:"Czr9C8Q3L4q2X9fG7vB3", name:"Olivia", desc:"Жіночий ніжний", emoji:"👩"},
  {id:"IKne3meq5aSn9rUgLFBY", name:"Liam", desc:"Чоловічий молодий", emoji:"🧔"},
  {id:"pMsXgVXv3BLzUgSXRplE", name:"Jessica", desc:"Жіночий американський", emoji:"👩"},
  {id:"onwK4e9ZLu2J4nY2f5uN", name:"Harry", desc:"Британський хлопець", emoji:"🧔"},
  {id:"VR6AewLTigWG4xSOukaG", name:"Arnold", desc:"Сильний", emoji:"🧔"},
  {id:"21m00Tcm4TlvDq8ikWAM", name:"Josh", desc:"Чоловічий впевнений", emoji:"🧔"},
];

let currentToken = '';
let history = [];
let currentTaskId = null;
let currentBlobUrl = null;
let selectedVoice = voicesDB[0];
let customVoice = null;

// ================== РЕШТА КОДУ (без змін, тільки оновлений renderVoices) ==================
function renderVoices(filtered) {
  const grid = document.getElementById('voicesGrid');
  grid.innerHTML = '';
  filtered.forEach(v => {
    const isSelected = (customVoice && v.id === customVoice.id) || (!customVoice && v.id === selectedVoice.id);
    const div = document.createElement('div');
    div.className = `voice-card bg-zinc-800 rounded-2xl p-4 cursor-pointer flex flex-col items-center text-center ${isSelected ? 'selected' : ''}`;
    div.innerHTML = `
      <div class="text-4xl mb-2">${v.emoji}</div>
      <div class="font-semibold">${v.name}</div>
      <div class="text-xs text-zinc-400">${v.desc}</div>
      <div class="text-[10px] text-purple-400 mt-1">${v.id.substring(0,8)}...</div>
    `;
    div.onclick = () => {
      customVoice = null;
      selectedVoice = v;
      document.getElementById('customStatus').innerHTML = '';
      renderVoices(filtered);
    };
    grid.appendChild(div);
  });
}

function filterVoices() {
  const term = document.getElementById('voiceSearch').value.toLowerCase().trim();
  let filtered = voicesDB.filter(v => 
    v.name.toLowerCase().includes(term) || 
    v.desc.toLowerCase().includes(term) ||
    v.id.toLowerCase().includes(term)
  );
  renderVoices(filtered);
}

function useCustomVoice() {
  const id = document.getElementById('customVoiceId').value.trim();
  if (!id) return alert('Введіть voice_id');
  
  customVoice = { id: id, name: "Custom", desc: "Ваш власний голос", emoji: "🔥" };
  selectedVoice = customVoice;
  document.getElementById('customStatus').innerHTML = `✅ Використовується: <b>${id}</b>`;
  renderVoices(voicesDB); // оновлюємо сітку
}

// ================== ТОКЕН, СИНТЕЗ, ПЛЕЄР, ІСТОРІЯ (той самий код як у попередній версії) ==================
function updateTokenStatus() { /* ... */ }
function showTokenModal() { /* ... */ }
function hideTokenModal() { /* ... */ }
function saveToken() { /* ... */ }
function renderHistory() { /* ... */ }
async function replayHistory(index) { /* ... */ }
async function synthesize() { /* ... (той самий) */ }
function startPolling() { /* ... */ }
async function playAudio(taskId, voiceName) { /* ... */ }
function downloadCurrent() { /* ... */ }
function hidePlayer() { /* ... */ }
function clearAll() { /* ... */ }
function clearHistory() { /* ... */ }

document.addEventListener('DOMContentLoaded', () => {
  updateTokenStatus();
  renderVoices(voicesDB);
  renderHistory();

  const ta = document.getElementById('textInput');
  ta.addEventListener('input', () => document.getElementById('charCount').textContent = `${ta.value.length} / 1 000 000`);

  const stab = document.getElementById('stability');
  const sim = document.getElementById('similarity');
  stab.oninput = () => document.getElementById('stabilityVal').textContent = parseFloat(stab.value).toFixed(2);
  sim.oninput = () => document.getElementById('similarityVal').textContent = parseFloat(sim.value).toFixed(2);
});
</script>
</body>
</html>
