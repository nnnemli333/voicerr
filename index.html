<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    .template-item { transition: all 0.2s; }
    .template-item:hover { background-color: #27272a; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<div class="max-w-6xl mx-auto p-8">
  <div class="flex items-center justify-between mb-10">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-waveform text-4xl text-violet-500"></i>
      <h1 class="text-3xl font-bold tracking-tighter">Voicer</h1>
    </div>
    <div onclick="showTokenModal()" class="cursor-pointer flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 px-5 py-2.5 rounded-3xl border border-zinc-700">
      <i class="fa-solid fa-key"></i>
      <span id="tokenStatus" class="text-sm font-medium">API токен</span>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

    <!-- ЛІВА КОЛОНКА: ШАБЛОНИ + CUSTOM -->
    <div class="lg:col-span-3 bg-zinc-900 rounded-3xl p-6 flex flex-col">
      <h2 class="font-semibold text-lg mb-4 flex items-center gap-2">
        <i class="fa-solid fa-bookmark"></i> Мої шаблони
      </h2>

      <div id="templatesList" class="flex-1 space-y-2 overflow-y-auto mb-6"></div>

      <button onclick="showCreateTemplateModal()" 
              class="w-full py-4 bg-violet-600 hover:bg-violet-700 rounded-3xl font-medium flex items-center justify-center gap-2">
        <i class="fa-solid fa-plus"></i> Створити новий шаблон
      </button>

      <div class="mt-8 pt-6 border-t border-zinc-700">
        <h3 class="text-sm font-medium mb-3">Custom Voice ID</h3>
        <div class="flex gap-2">
          <input id="customVoiceId" type="text" placeholder="voice_id ..." 
                 class="flex-1 bg-zinc-800 rounded-3xl px-5 py-4 text-sm outline-none">
          <button onclick="applyCustomVoice()" 
                  class="bg-zinc-700 hover:bg-zinc-600 px-6 rounded-3xl text-sm">Застосувати</button>
        </div>
      </div>
    </div>

    <!-- ЦЕНТР: ТЕКСТ -->
    <div class="lg:col-span-6">
      <div class="bg-zinc-900 rounded-3xl p-7">
        <div class="flex justify-between mb-4">
          <span class="font-medium">Текст для озвучки</span>
          <span id="charCount" class="text-zinc-400 text-sm">0 / 1 000 000</span>
        </div>
        <textarea id="textInput" rows="12" 
                  class="w-full bg-zinc-800 rounded-3xl p-6 outline-none resize-none text-base"
                  placeholder="Вставте текст тут..."></textarea>
      </div>

      <button onclick="synthesize()" 
              class="mt-6 w-full py-7 text-2xl font-semibold bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-700 hover:to-purple-700 rounded-3xl flex items-center justify-center gap-3 transition">
        <i class="fa-solid fa-play"></i> ОЗВУЧИТИ
      </button>

      <div id="status" class="mt-4 text-center text-sm text-zinc-400 min-h-8"></div>

      <!-- ПЛЕЄР -->
      <div id="playerContainer" class="hidden mt-6 bg-zinc-900 rounded-3xl p-6">
        <audio id="audioPlayer" controls class="w-full"></audio>
        <div class="flex gap-4 mt-6">
          <button onclick="downloadCurrent()" class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-700 rounded-3xl flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i> Завантажити MP3
          </button>
          <button onclick="hidePlayer()" class="flex-1 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-3xl">Закрити</button>
        </div>
      </div>
    </div>

    <!-- ПРАВА КОЛОНКА: НАЛАШТУВАННЯ -->
    <div class="lg:col-span-3 bg-zinc-900 rounded-3xl p-6 space-y-7">
      <h2 class="font-semibold text-lg">Налаштування голосу</h2>

      <div>
        <label class="block text-sm text-zinc-400 mb-2">Модель</label>
        <select id="modelSelect" class="w-full bg-zinc-800 rounded-3xl px-5 py-4 outline-none">
          <option value="eleven_multilingual_v2">Multilingual v2 (найкраща)</option>
          <option value="eleven_turbo_v2_5">Turbo v2.5 (швидка)</option>
          <option value="eleven_flash_v2_5">Flash v2.5 (найшвидша)</option>
          <option value="eleven_v3">v3 (найвиразніша)</option>
        </select>
      </div>

      <div class="space-y-6">
        <div>
          <div class="flex justify-between text-sm mb-1"><span>Stability</span><span id="stabilityVal" class="text-violet-400">0.75</span></div>
          <input type="range" id="stability" min="0" max="1" step="0.01" value="0.75" class="w-full accent-violet-500">
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1"><span>Similarity Boost</span><span id="similarityVal" class="text-violet-400">0.85</span></div>
          <input type="range" id="similarity" min="0" max="1" step="0.01" value="0.85" class="w-full accent-violet-500">
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1"><span>Style</span><span id="styleVal" class="text-violet-400">0.10</span></div>
          <input type="range" id="style" min="0" max="1" step="0.01" value="0.10" class="w-full accent-violet-500">
        </div>
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="speakerBoost" checked class="w-5 h-5 accent-violet-500">
          <span>Speaker Boost</span>
        </label>
        <div class="flex items-center gap-3">
          <span class="text-sm text-zinc-400">Авто-паузи</span>
          <input type="checkbox" id="autoPause" checked class="w-5 h-5 accent-violet-500">
          <input id="pauseDuration" type="number" value="1.2" step="0.1" class="w-16 bg-zinc-800 rounded-3xl px-4 py-2 text-center text-sm">
          <span class="text-xs text-zinc-400">сек</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- МОДАЛКИ -->
<div id="tokenModal" onclick="if(event.target===this)hideTokenModal()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-zinc-900 rounded-3xl p-8 w-full max-w-md">
    <h3 class="text-2xl font-semibold mb-6">API токен</h3>
    <input id="tokenInput" type="password" placeholder="sk_..." class="w-full bg-zinc-800 rounded-3xl px-6 py-5 outline-none mb-6">
    <button onclick="saveToken()" class="w-full py-5 bg-violet-600 hover:bg-violet-700 rounded-3xl font-medium">Зберегти</button>
  </div>
</div>

<div id="createTemplateModal" onclick="if(event.target===this)hideCreateTemplateModal()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-zinc-900 rounded-3xl p-8 w-full max-w-md">
    <h3 class="text-2xl font-semibold mb-6">Новий шаблон</h3>
    <input id="templateName" type="text" placeholder="Назва шаблону" class="w-full bg-zinc-800 rounded-3xl px-6 py-5 outline-none mb-6">
    <button onclick="createTemplate()" class="w-full py-5 bg-violet-600 hover:bg-violet-700 rounded-3xl font-medium">Зберегти шаблон</button>
  </div>
</div>

<script>
// ================== ЗМІННІ ==================
const API_BASE = "https://voicer.mat3u.com/api/v1";
let currentToken = localStorage.getItem('voicerToken') || '';
let templates = JSON.parse(localStorage.getItem('voicerTemplates')) || [];
let currentVoiceId = '';
let currentBlobUrl = null;

// ================== ТОКЕН ==================
function updateTokenStatus() {
  document.getElementById('tokenStatus').innerHTML = currentToken 
    ? `✅ Підключено` 
    : `🔑 Введіть токен`;
}
function showTokenModal() { document.getElementById('tokenModal').classList.remove('hidden'); }
function hideTokenModal() { document.getElementById('tokenModal').classList.add('hidden'); }
function saveToken() {
  currentToken = document.getElementById('tokenInput').value.trim();
  localStorage.setItem('voicerToken', currentToken);
  hideTokenModal();
  updateTokenStatus();
}

// ================== ШАБЛОНИ ==================
function renderTemplates() {
  const container = document.getElementById('templatesList');
  container.innerHTML = templates.length === 0 
    ? `<p class="text-zinc-500 text-center py-8">Шаблонів ще немає</p>` 
    : '';

  templates.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = `template-item bg-zinc-800 rounded-3xl px-5 py-4 cursor-pointer flex justify-between items-center`;
    div.innerHTML = `
      <div>
        <div class="font-medium">${t.name}</div>
        <div class="text-xs text-zinc-400 font-mono">${t.voiceId.slice(0,8)}…</div>
      </div>
      <div class="flex gap-3">
        <button onclick="event.stopImmediatePropagation(); useTemplate(${i});" class="text-violet-400 text-sm">Використати</button>
        <button onclick="event.stopImmediatePropagation(); deleteTemplate(${i});" class="text-red-400 text-sm">×</button>
      </div>`;
    container.appendChild(div);
  });
}

function showCreateTemplateModal() {
  document.getElementById('createTemplateModal').classList.remove('hidden');
  document.getElementById('templateName').focus();
}

function hideCreateTemplateModal() {
  document.getElementById('createTemplateModal').classList.add('hidden');
}

function createTemplate() {
  const name = document.getElementById('templateName').value.trim();
  if (!name) return alert('Введіть назву шаблону');
  if (!currentVoiceId) return alert('Спочатку введіть voice_id');

  templates.push({
    name,
    voiceId: currentVoiceId,
    model: document.getElementById('modelSelect').value,
    stability: parseFloat(document.getElementById('stability').value),
    similarity: parseFloat(document.getElementById('similarity').value),
    style: parseFloat(document.getElementById('style').value),
    speakerBoost: document.getElementById('speakerBoost').checked,
    autoPause: document.getElementById('autoPause').checked,
    pauseDuration: parseFloat(document.getElementById('pauseDuration').value)
  });

  localStorage.setItem('voicerTemplates', JSON.stringify(templates));
  hideCreateTemplateModal();
  renderTemplates();
  alert(`Шаблон «${name}» збережено!`);
}

function useTemplate(i) {
  const t = templates[i];
  currentVoiceId = t.voiceId;
  document.getElementById('modelSelect').value = t.model;
  document.getElementById('stability').value = t.stability;
  document.getElementById('similarity').value = t.similarity;
  document.getElementById('style').value = t.style;
  document.getElementById('speakerBoost').checked = t.speakerBoost;
  document.getElementById('autoPause').checked = t.autoPause;
  document.getElementById('pauseDuration').value = t.pauseDuration;

  // оновлюємо значення під слайдерами
  document.getElementById('stabilityVal').textContent = t.stability.toFixed(2);
  document.getElementById('similarityVal').textContent = t.similarity.toFixed(2);
  document.getElementById('styleVal').textContent = t.style.toFixed(2);

  hideCreateTemplateModal();
  alert(`Шаблон «${t.name}» завантажено!`);
}

function deleteTemplate(i) {
  if (confirm('Видалити цей шаблон?')) {
    templates.splice(i, 1);
    localStorage.setItem('voicerTemplates', JSON.stringify(templates));
    renderTemplates();
  }
}

function applyCustomVoice() {
  currentVoiceId = document.getElementById('customVoiceId').value.trim();
  if (currentVoiceId) alert('Custom voice ID застосовано!');
}

// ================== СИНТЕЗ (оновлений) ==================
async function synthesize() {
  if (!currentToken) return alert('Введіть API токен!');
  if (!currentVoiceId) return alert('Введіть voice_id (або виберіть шаблон)');

  const text = document.getElementById('textInput').value.trim();
  if (!text) return alert('Введіть текст!');

  document.getElementById('status').innerHTML = '🚀 Генеруємо...';

  const body = {
    text: text,
    voice_id: currentVoiceId,
    model_id: document.getElementById('modelSelect').value,
    auto_pause_enabled: document.getElementById('autoPause').checked,
    auto_pause_duration: parseFloat(document.getElementById('pauseDuration').value) || 1.2,
    voice_settings: {
      stability: parseFloat(document.getElementById('stability').value),
      similarity_boost: parseFloat(document.getElementById('similarity').value),
      style: parseFloat(document.getElementById('style').value),
      use_speaker_boost: document.getElementById('speakerBoost').checked
    }
  };

  try {
    const res = await fetch(`${API_BASE}/voice/synthesize`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${currentToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    startPolling(data.task_id);
  } catch (e) {
    document.getElementById('status').innerHTML = '❌ Помилка';
  }
}

function startPolling(taskId) { /* той самий код, що був раніше */ }
async function playAudio(taskId) { /* той самий код */ }
function downloadCurrent() { /* той самий */ }
function hidePlayer() { /* той самий */ }

// ================== ІНІЦІАЛІЗАЦІЯ ==================
document.addEventListener('DOMContentLoaded', () => {
  updateTokenStatus();
  renderTemplates();

  const ta = document.getElementById('textInput');
  ta.addEventListener('input', () => {
    document.getElementById('charCount').textContent = `${ta.value.length} / 1 000 000`;
  });

  // оновлення значень слайдерів
  const updateVal = (id, valId) => {
    document.getElementById(id).oninput = () => {
      document.getElementById(valId).textContent = parseFloat(document.getElementById(id).value).toFixed(2);
    };
  };
  updateVal('stability', 'stabilityVal');
  updateVal('similarity', 'similarityVal');
  updateVal('style', 'styleVal');
});
</script>
</body>
</html>
