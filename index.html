<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; }
    .hacker-green { color: #00ff9d; }
    .accent-hacker { accent-color: #00ff9d; }
    .btn-hacker { background: #00ff9d; color: #000; font-weight: 600; }
    .btn-hacker:hover { background: #00cc7a; box-shadow: 0 0 20px #00ff9d88; }
    .modal { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .processing { animation: pulse 1.5s infinite; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">
<div class="max-w-7xl mx-auto p-6">

  <!-- HEADER -->
  <div class="flex items-center justify-between mb-8 border-b border-zinc-800 pb-6">
    <div class="flex items-center gap-4">
      <i class="fa-solid fa-waveform text-4xl hacker-green"></i>
      <h1 class="text-3xl font-bold tracking-tight text-white">Voicer</h1>
    </div>
    <div onclick="showTokenModal()" class="cursor-pointer flex items-center gap-3 bg-zinc-900 hover:bg-zinc-800 px-6 py-3 rounded-2xl border border-[#00ff9d33]">
      <i class="fa-solid fa-key hacker-green"></i>
      <span id="tokenStatus" class="font-medium">API токен</span>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-6">
    <!-- ШАБЛОНИ -->
    <div class="col-span-12 lg:col-span-3 bg-zinc-900 rounded-3xl p-6 border border-[#00ff9d33]">
      <div class="flex justify-between items-center mb-5">
        <h2 class="font-semibold text-lg flex items-center gap-2 hacker-green"><i class="fa-solid fa-bookmark"></i> Мої шаблони</h2>
        <button onclick="showCreateTemplateModal()" class="hacker-green hover:text-white flex items-center gap-1 text-sm"><i class="fa-solid fa-plus"></i> Новий</button>
      </div>
      <div id="templatesList" class="space-y-2 max-h-96 overflow-y-auto"></div>
    </div>

    <!-- ТЕКСТ -->
    <div class="col-span-12 lg:col-span-6">
      <div class="bg-zinc-900 rounded-3xl p-7 border border-[#00ff9d33]">
        <div class="flex justify-between mb-4 text-sm">
          <span class="text-zinc-300">Текст для озвучки</span>
          <span id="charCount" class="text-zinc-500">0 / 1 000 000</span>
        </div>
        <textarea id="textInput" rows="11" class="w-full bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl p-6 outline-none text-base resize-none" placeholder="Вставте або напишіть текст..."></textarea>
      </div>

      <button onclick="synthesize()" class="mt-6 w-full py-6 text-xl font-semibold btn-hacker rounded-3xl flex items-center justify-center gap-3">
        <i class="fa-solid fa-play"></i> ОЗВУЧИТИ ТЕКСТ
      </button>
    </div>

    <!-- НАЛАШТУВАННЯ -->
    <div class="col-span-12 lg:col-span-3 bg-zinc-900 rounded-3xl p-6 space-y-6 border border-[#00ff9d33]">
      <h2 class="font-semibold text-lg mb-2 hacker-green">Налаштування</h2>
      <div>
        <label class="block text-xs text-zinc-400 mb-2">МОДЕЛЬ</label>
        <select id="modelSelect" class="w-full bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl px-5 py-4 outline-none text-sm">
          <option value="eleven_multilingual_v2">Multilingual v2</option>
          <option value="eleven_turbo_v2_5">Turbo v2.5</option>
          <option value="eleven_flash_v2_5">Flash v2.5</option>
          <option value="eleven_v3">v3</option>
        </select>
      </div>

      <div class="space-y-5">
        <div><div class="flex justify-between text-xs mb-1"><span>Stability</span><span id="stabilityVal" class="hacker-green">0.75</span></div><input type="range" id="stability" min="0" max="1" step="0.01" value="0.75" class="w-full accent-hacker"></div>
        <div><div class="flex justify-between text-xs mb-1"><span>Similarity</span><span id="similarityVal" class="hacker-green">0.85</span></div><input type="range" id="similarity" min="0" max="1" step="0.01" value="0.85" class="w-full accent-hacker"></div>
        <div><div class="flex justify-between text-xs mb-1"><span>Style</span><span id="styleVal" class="hacker-green">0.10</span></div><input type="range" id="style" min="0" max="1" step="0.01" value="0.10" class="w-full accent-hacker"></div>
      </div>

      <div class="pt-4 border-t border-zinc-700 flex flex-col gap-4 text-sm">
        <label class="flex items-center gap-3"><input type="checkbox" id="speakerBoost" checked class="w-5 h-5 accent-hacker"> Speaker Boost</label>
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-3"><input type="checkbox" id="autoPause" checked class="w-5 h-5 accent-hacker"> Авто-паузи</label>
          <input id="pauseDuration" type="number" value="1.2" step="0.1" class="w-20 bg-zinc-950 border border-zinc-700 rounded-3xl px-4 py-2 text-center">
          <span class="text-xs text-zinc-400">сек</span>
        </div>
      </div>

      <div class="pt-6 border-t border-zinc-700">
        <p class="text-xs text-zinc-400 mb-2">VOICE ID</p>
        <div class="flex gap-2">
          <input id="voiceIdInput" type="text" placeholder="Встав voice_id сюди" class="flex-1 bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl px-5 py-4 text-sm outline-none">
          <button onclick="setVoiceId()" class="btn-hacker px-6 rounded-3xl text-sm">OK</button>
        </div>
        <div id="currentVoice" class="mt-3 text-xs hacker-green font-mono break-all"></div>
      </div>
    </div>
  </div>

  <!-- PLAYER PANEL -->
  <div id="playerPanel" class="hidden mt-8 bg-zinc-900 rounded-3xl p-6 border border-[#00ff9d33]">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-medium hacker-green flex items-center gap-2"><i class="fa-solid fa-volume-high"></i> Результат озвучки</h3>
      <button onclick="hidePlayer()" class="text-xs text-zinc-400 hover:text-red-400">закрити</button>
    </div>
    <div class="flex flex-col md:flex-row items-center gap-4">
      <audio id="audioPlayer" controls class="w-full md:flex-1"></audio>
      <div class="flex items-center gap-3">
        <span id="audioDuration" class="font-mono text-sm text-zinc-400">0:00</span>
        <button onclick="downloadAudio()" class="btn-hacker px-8 py-3 rounded-3xl flex items-center gap-2 text-sm">
          <i class="fa-solid fa-download"></i> Завантажити MP3
        </button>
      </div>
    </div>
    <div id="processingStatus" class="hidden mt-4 text-center text-emerald-400 flex items-center justify-center gap-2 processing">
      <i class="fa-solid fa-spinner fa-spin"></i> Генеруємо аудіо...
    </div>
  </div>

  <!-- LOG -->
  <div class="mt-8 bg-zinc-900 rounded-3xl p-6 border border-[#00ff9d33]">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-medium hacker-green flex items-center gap-2"><i class="fa-solid fa-terminal"></i> ЛОГ</h3>
      <button onclick="clearLogs()" class="text-xs text-zinc-400 hover:text-red-400">очистити</button>
    </div>
    <div id="logContainer" class="h-56 overflow-y-auto bg-black/70 rounded-2xl p-5 text-xs hacker-green log-line space-y-1"></div>
  </div>
</div>

<!-- MODALS -->
<div id="tokenModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
  <div class="modal bg-zinc-900 rounded-3xl p-8 w-full max-w-md border border-[#00ff9d33] relative">
    <button onclick="closeModal('tokenModal')" class="absolute top-4 right-4 text-3xl text-zinc-400 hover:text-white">×</button>
    <h3 class="text-xl font-semibold mb-6 hacker-green">API токен</h3>
    <input id="tokenInput" type="password" placeholder="sk_..." class="w-full bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl px-6 py-5 outline-none">
    <button onclick="saveToken()" class="mt-6 w-full py-5 btn-hacker rounded-3xl font-medium">Зберегти</button>
  </div>
</div>

<div id="templateModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
  <div class="modal bg-zinc-900 rounded-3xl p-8 w-full max-w-md border border-[#00ff9d33] relative">
    <button onclick="closeModal('templateModal')" class="absolute top-4 right-4 text-3xl text-zinc-400 hover:text-white">×</button>
    <h3 class="text-xl font-semibold mb-6 hacker-green">Новий шаблон голосу</h3>
    <input id="templateName" placeholder="Назва шаблону (наприклад: French Male)" class="w-full bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl px-6 py-5 outline-none mb-6">
    <button onclick="createTemplate()" class="w-full py-5 btn-hacker rounded-3xl font-medium">Зберегти налаштування голосу</button>
  </div>
</div>

<script>
// ================== ЗМІННІ ==================
const API_BASE = "https://voicer.mat3u.com/api/v1";
let currentToken = '';
let currentVoiceId = '';
let templates = [];
let logs = [];
let currentAudioUrl = null;
let pollingInterval = null;

// Завантаження даних
try {
  currentToken = localStorage.getItem('voicerToken') || '';
  const saved = localStorage.getItem('voicerTemplates');
  if (saved) templates = JSON.parse(saved);
} catch (e) {}

// ================== LOG ==================
function addLog(message, type = 'info') {
  const time = new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const color = type === 'error' ? 'text-red-400' : 'hacker-green';
  logs.push(`<span class="text-zinc-500">[${time}]</span> <span class="${color}">${message}</span>`);
  if (logs.length > 50) logs.shift();
  const el = document.getElementById('logContainer');
  el.innerHTML = logs.join('<br>');
  el.scrollTop = 999999;
}

function clearLogs() {
  logs = [];
  document.getElementById('logContainer').innerHTML = '';
  addLog('Лог очищено', 'info');
}

// ================== МОДАЛКИ ==================
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function showTokenModal() { closeModal('templateModal'); document.getElementById('tokenModal').classList.remove('hidden'); }
function showCreateTemplateModal() { closeModal('tokenModal'); document.getElementById('templateModal').classList.remove('hidden'); document.getElementById('templateName').focus(); }

// ================== ТОКЕН ==================
function updateTokenStatus() {
  document.getElementById('tokenStatus').innerHTML = currentToken ? `<span class="hacker-green">✅ Підключено</span>` : `🔑 Токен`;
}
function saveToken() {
  currentToken = document.getElementById('tokenInput').value.trim();
  try { localStorage.setItem('voicerToken', currentToken); } catch(e){}
  closeModal('tokenModal');
  updateTokenStatus();
  addLog('Токен збережено', 'success');
}

// ================== ШАБЛОНИ (ТЕПЕР ЗБЕРІГАЮТЬ НАЛАШТУВАННЯ ГОЛОСУ) ==================
function saveTemplates() {
  try { localStorage.setItem('voicerTemplates', JSON.stringify(templates)); } catch(e){}
}

function renderTemplates() {
  const container = document.getElementById('templatesList');
  container.innerHTML = templates.length === 0 ? `<div class="text-zinc-500 text-sm py-8 text-center">Ще немає шаблонів голосу</div>` : '';

  templates.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = "bg-zinc-950 hover:bg-zinc-800 p-4 rounded-2xl border border-zinc-700 hover:border-[#00ff9d33] cursor-pointer transition flex justify-between items-center";
    div.innerHTML = `
      <div>
        <div class="font-medium">${t.name}</div>
        <div class="text-xs text-zinc-400 font-mono">${t.voice_id.slice(0,12)}...</div>
      </div>
      <div class="flex gap-3">
        <button onclick="useTemplate(${i}); event.stopImmediatePropagation()" class="text-[#00ff9d] hover:text-white text-xl">▶</button>
        <button onclick="deleteTemplate(${i}); event.stopImmediatePropagation()" class="text-red-400 hover:text-red-500 text-xl">🗑</button>
      </div>
    `;
    div.onclick = () => useTemplate(i);
    container.appendChild(div);
  });
}

function createTemplate() {
  const name = document.getElementById('templateName').value.trim();
  if (!name) return alert("Введіть назву шаблону!");

  const template = {
    name,
    voice_id: document.getElementById('voiceIdInput').value.trim() || currentVoiceId,
    model_id: document.getElementById('modelSelect').value,
    voice_settings: {
      stability: parseFloat(document.getElementById('stability').value),
      similarity_boost: parseFloat(document.getElementById('similarity').value),
      style: parseFloat(document.getElementById('style').value),
      use_speaker_boost: document.getElementById('speakerBoost').checked
    },
    auto_pause_enabled: document.getElementById('autoPause').checked,
    auto_pause_duration: parseFloat(document.getElementById('pauseDuration').value) || 1.2
  };

  templates.push(template);
  saveTemplates();
  closeModal('templateModal');
  document.getElementById('templateName').value = '';
  renderTemplates();
  addLog(`Шаблон голосу "${name}" збережено`, 'success');
}

function deleteTemplate(i) {
  if (confirm(`Видалити шаблон "${templates[i].name}"?`)) {
    templates.splice(i, 1);
    saveTemplates();
    renderTemplates();
    addLog('Шаблон видалено', 'success');
  }
}

function useTemplate(i) {
  const t = templates[i];
  currentVoiceId = t.voice_id;
  document.getElementById('voiceIdInput').value = t.voice_id;
  document.getElementById('currentVoice').textContent = t.voice_id;

  document.getElementById('modelSelect').value = t.model_id;
  document.getElementById('stability').value = t.voice_settings.stability;
  document.getElementById('similarity').value = t.voice_settings.similarity_boost;
  document.getElementById('style').value = t.voice_settings.style;
  document.getElementById('speakerBoost').checked = t.voice_settings.use_speaker_boost;
  document.getElementById('autoPause').checked = t.auto_pause_enabled;
  document.getElementById('pauseDuration').value = t.auto_pause_duration;

  // оновити значення слайдерів
  ['stability','similarity','style'].forEach(id => {
    document.getElementById(id + 'Val').textContent = parseFloat(document.getElementById(id).value).toFixed(2);
  });

  addLog(`Завантажено налаштування голосу: ${t.name}`, 'success');
}

// ================== VOICE ID ==================
function setVoiceId() {
  currentVoiceId = document.getElementById('voiceIdInput').value.trim();
  if (currentVoiceId) {
    document.getElementById('currentVoice').textContent = currentVoiceId;
    addLog(`Voice ID встановлено`, 'success');
  }
}

// ================== СИНТЕЗ + ПОЛІНГ + ПЛЕЄР ==================
async function synthesize() {
  if (!currentToken) return alert('Введіть API токен!');
  if (!currentVoiceId) return alert('Вкажіть Voice ID!');
  const text = document.getElementById('textInput').value.trim();
  if (!text) return alert('Введіть текст для озвучки!');

  addLog('Надсилаємо запит на синтез...', 'info');
  document.getElementById('processingStatus').classList.remove('hidden');
  document.getElementById('playerPanel').classList.remove('hidden');

  const body = {
    text,
    voice_id: currentVoiceId,
    model_id: document.getElementById('modelSelect').value,
    auto_pause_enabled: document.getElementById('autoPause').checked,
    auto_pause_duration: parseFloat(document.getElementById('pauseDuration').value) || 1.2,
    voice_settings: {
      stability: parseFloat(document.getElementById('stability').value),
      similarity_boost: parseFloat(document.getElementById('similarity').value),
      style: parseFloat(document.getElementById('style').value),
      use_speaker_boost: document.getElementById('speakerBoost').checked
    }
  };

  try {
    const res = await fetch(`${API_BASE}/voice/synthesize`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (data.task_id) {
      addLog(`Задача створена. Task ID: ${data.task_id}`, 'success');
      startPolling(data.task_id);
    } else {
      addLog('Не отримано task_id', 'error');
    }
  } catch (e) {
    addLog(`Помилка запиту: ${e.message}`, 'error');
    document.getElementById('processingStatus').classList.add('hidden');
  }
}

function startPolling(task_id) {
  if (pollingInterval) clearInterval(pollingInterval);

  pollingInterval = setInterval(async () => {
    try {
      const res = await fetch(`${API_BASE}/voice/task/${task_id}`, {
        headers: { 'Authorization': `Bearer ${currentToken}` }
      });
      const data = await res.json();

      if (data.status === 'completed' && data.audio_url) {
        clearInterval(pollingInterval);
        document.getElementById('processingStatus').classList.add('hidden');
        showAudioPlayer(data.audio_url);
        addLog('Аудіо готове!', 'success');
      } else if (data.status === 'failed') {
        clearInterval(pollingInterval);
        document.getElementById('processingStatus').classList.add('hidden');
        addLog('Помилка генерації аудіо', 'error');
      }
    } catch (e) {}
  }, 1200);
}

function showAudioPlayer(url) {
  currentAudioUrl = url;
  const player = document.getElementById('audioPlayer');
  player.src = url;

  // Тривалість
  const audio = new Audio(url);
  audio.onloadedmetadata = () => {
    const min = Math.floor(audio.duration / 60);
    const sec = Math.floor(audio.duration % 60);
    document.getElementById('audioDuration').textContent = `${min}:${sec < 10 ? '0' : ''}${sec}`;
  };

  player.play().catch(() => {});
}

function downloadAudio() {
  if (!currentAudioUrl) return;
  const a = document.createElement('a');
  a.href = currentAudioUrl;
  a.download = `voicer_${new Date().toISOString().slice(0,19)}.mp3`;
  a.click();
}

function hidePlayer() {
  document.getElementById('playerPanel').classList.add('hidden');
  document.getElementById('audioPlayer').pause();
  if (pollingInterval) clearInterval(pollingInterval);
}

// ================== INIT ==================
document.addEventListener('DOMContentLoaded', () => {
  updateTokenStatus();
  renderTemplates();
  addLog('Voicer запущено — хакерський режим', 'success');

  document.getElementById('textInput').addEventListener('input', () => {
    const count = document.getElementById('textInput').value.length;
    document.getElementById('charCount').textContent = `${count} / 1 000 000`;
  });

  ['stability','similarity','style'].forEach(id => {
    const el = document.getElementById(id);
    el.oninput = () => document.getElementById(id + 'Val').textContent = parseFloat(el.value).toFixed(2);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal('tokenModal');
      closeModal('templateModal');
    }
  });
});
</script>
</body>
</html>
