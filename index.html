<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicer — ElevenLabs v3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div class="max-w-6xl mx-auto p-6">
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-waveform text-4xl text-emerald-500"></i>
      <h1 class="text-3xl font-bold text-emerald-400">Voicer — ElevenLabs</h1>
    </div>
    
    <div onclick="showTokenModal()" id="tokenButton"
         class="flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 px-6 py-3 rounded-2xl cursor-pointer border border-zinc-700">
      <i class="fa-solid fa-key"></i>
      <span id="tokenStatus" class="text-sm font-medium">API токен</span>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- SIDEBAR -->
    <div class="lg:col-span-3 bg-zinc-900 rounded-3xl p-6 space-y-6">
      <div>
        <h2 class="text-xl font-semibold mb-3 text-emerald-400 flex items-center gap-2">
          <i class="fa-solid fa-id-card"></i> Voice ID
        </h2>
        <input id="voiceId" type="text" value="21m00Tcm4TlvDq8ikWAM" 
               class="w-full bg-zinc-800 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <div>
        <h2 class="text-xl font-semibold mb-3 text-emerald-400">Модель</h2>
        <select id="modelSelect" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="eleven_v3">🌟 Eleven v3 (найкраща)</option>
          <option value="eleven_multilingual_v2">🌍 Multilingual v2</option>
          <option value="eleven_turbo_v2_5">⚡ Turbo v2.5</option>
          <option value="eleven_flash_v2_5">⚡ Flash v2.5</option>
        </select>
      </div>
    </div>

    <!-- MAIN -->
    <div class="lg:col-span-6 space-y-6">
      <div class="bg-zinc-900 rounded-3xl p-6">
        <div class="flex justify-between mb-3">
          <label class="font-medium">Текст для озвучення</label>
          <span id="charCount" class="text-zinc-400 text-sm">0 / 1 000 000</span>
        </div>
        <textarea id="textInput" rows="10" 
                  class="w-full bg-zinc-800 rounded-2xl p-5 outline-none resize-none text-lg"
                  placeholder="Вставте сюди текст..."></textarea>
      </div>

      <div class="flex gap-4">
        <button onclick="synthesize()" 
                class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 py-7 text-2xl font-semibold rounded-3xl">
          <i class="fa-solid fa-play mr-3"></i> ОЗВУЧИТИ
        </button>
        <button onclick="clearAll()" 
                class="px-8 bg-zinc-800 hover:bg-red-900/50 rounded-3xl text-2xl">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>

      <div id="playerContainer" class="hidden bg-zinc-900 rounded-3xl p-6">
        <audio id="audioPlayer" controls class="w-full"></audio>
        <div class="flex gap-3 mt-5">
          <button onclick="downloadCurrent()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-4 rounded-2xl flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i> Завантажити MP3
          </button>
          <button onclick="hidePlayer()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl">Закрити</button>
        </div>
      </div>

      <div id="status" class="text-center text-sm min-h-[30px]"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="lg:col-span-3 bg-zinc-900 rounded-3xl p-6">
      <h2 class="text-xl font-semibold mb-4 text-emerald-400">Авто-паузи</h2>
      <div class="space-y-4">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="autoPause" checked class="w-5 h-5 accent-emerald-500">
          <span>Увімкнути автоматичні паузи</span>
        </label>
        <div class="flex items-center gap-3">
          <span class="text-sm text-zinc-400">Тривалість:</span>
          <input id="pauseDuration" type="number" value="1.5" step="0.1" min="0.1" 
                 class="w-20 bg-zinc-800 rounded-xl px-4 py-2 text-center">
          <span class="text-sm text-zinc-400">сек</span>
        </div>
      </div>

      <div class="mt-10">
        <h2 class="text-xl font-semibold mb-4 text-emerald-400">Історія</h2>
        <div id="historyList" class="space-y-3 max-h-80 overflow-y-auto"></div>
        <button onclick="clearHistory()" class="mt-4 text-xs text-red-400 hover:text-red-300">Очистити історію</button>
      </div>
    </div>
  </div>
</div>

<!-- TOKEN MODAL -->
<div id="tokenModal" onclick="if(event.target===this)hideTokenModal()" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div onclick="event.stopImmediatePropagation()" class="bg-zinc-900 rounded-3xl p-8 w-full max-w-md">
    <h3 class="text-2xl font-bold mb-6">Ваш API токен</h3>
    <input id="tokenInput" type="password" placeholder="sk_..." 
           class="w-full bg-zinc-800 rounded-2xl px-5 py-4 text-lg outline-none mb-6">
    
    <div class="flex gap-3">
      <button onclick="saveToken()" 
              class="flex-1 bg-emerald-600 hover:bg-emerald-700 py-4 text-lg font-semibold rounded-2xl">Зберегти</button>
      <button onclick="deleteToken()" 
              class="flex-1 bg-red-600/80 hover:bg-red-700 py-4 text-lg font-semibold rounded-2xl">Видалити токен</button>
    </div>
  </div>
</div>

<script>
// ================== ЗМІННІ ==================
let currentToken = '';

// ================== ТОКЕН ==================
function updateTokenStatus() {
  const statusEl = document.getElementById('tokenStatus');
  if (currentToken && currentToken.startsWith('sk_')) {
    statusEl.innerHTML = `<span class="text-emerald-400">✓ Токен активний</span>`;
    document.getElementById('tokenButton').classList.add('border-emerald-500');
  } else {
    statusEl.innerHTML = `<span class="text-red-400">API токен (не підключено)</span>`;
    document.getElementById('tokenButton').classList.remove('border-emerald-500');
  }
}

function showTokenModal() {
  document.getElementById('tokenInput').value = currentToken;
  document.getElementById('tokenModal').classList.remove('hidden');
}

function hideTokenModal() {
  document.getElementById('tokenModal').classList.add('hidden');
}

function saveToken() {
  const val = document.getElementById('tokenInput').value.trim();
  if (val) {
    currentToken = val;
    localStorage.setItem('voicerToken', val);
    updateTokenStatus();
    hideTokenModal();
  }
}

function deleteToken() {
  if (confirm('Видалити токен повністю?')) {
    currentToken = '';
    localStorage.removeItem('voicerToken');
    updateTokenStatus();
    hideTokenModal();
  }
}

// ================== СИНТЕЗ (з покращеною обробкою помилок) ==================
async function synthesize() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) return alert('Введіть текст');

  if (!currentToken) {
    alert('Спочатку вставте та збережіть API токен!');
    showTokenModal();
    return;
  }

  const voiceId = document.getElementById('voiceId').value.trim();
  if (!voiceId) return alert('Введіть Voice ID');

  const model = document.getElementById('modelSelect').value;
  const autoPause = document.getElementById('autoPause').checked;
  const pauseDuration = parseFloat(document.getElementById('pauseDuration').value) || 1.5;

  const statusEl = document.getElementById('status');
  statusEl.innerHTML = '<span class="text-emerald-400">Надсилання запиту...</span>';

  try {
    const res = await fetch('https://voicer.mat3u.com/api/v1/voice/synthesize', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${currentToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        text: text,
        voice_id: voiceId,
        model_id: model,
        auto_pause_enabled: autoPause,
        auto_pause_duration: pauseDuration,
        split_output: false
      })
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || `Помилка сервера (${res.status})`);
    }

    const data = await res.json();
    const taskId = data.task_id;

    statusEl.textContent = `Задача #${taskId} — обробка...`;

    // Полінг
    const poll = setInterval(async () => {
      try {
        const sRes = await fetch(`https://voicer.mat3u.com/api/v1/voice/status/${taskId}`, {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        const sData = await sRes.json();

        if (sData.status === 'completed') {
          clearInterval(poll);
          playAudio(taskId);
        } else if (sData.status === 'failed' || sData.status === 'censored') {
          clearInterval(poll);
          statusEl.textContent = `Помилка: ${sData.status}`;
        }
      } catch(e) {}
    }, 2000);

  } catch (err) {
    console.error(err);
    statusEl.innerHTML = `<span class="text-red-400">Помилка: ${err.message}</span>`;
    if (err.message.includes('fetch') || err.message.includes('Failed')) {
      statusEl.innerHTML += `<br><small class="text-zinc-500">Перевірте токен та підключення до інтернету</small>`;
    }
  }
}

async function playAudio(taskId) {
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Завантаження аудіо...';

  try {
    const res = await fetch(`https://voicer.mat3u.com/api/v1/voice/download/${taskId}`, {
      headers: { 'Authorization': `Bearer ${currentToken}` }
    });

    if (!res.ok) throw new Error('Не вдалося завантажити');

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    const player = document.getElementById('audioPlayer');
    player.src = url;
    document.getElementById('playerContainer').classList.remove('hidden');
    player.play();

    statusEl.innerHTML = '<span class="text-emerald-400">✅ Готово!</span>';
  } catch (err) {
    statusEl.textContent = 'Помилка завантаження файлу';
  }
}

function downloadCurrent() {
  const player = document.getElementById('audioPlayer');
  if (player.src) {
    const a = document.createElement('a');
    a.href = player.src;
    a.download = `voice_${Date.now()}.mp3`;
    a.click();
  }
}

function hidePlayer() {
  document.getElementById('playerContainer').classList.add('hidden');
}

// ================== ІСТОРІЯ (спрощена) ==================
let history = JSON.parse(localStorage.getItem('voicerHistory') || '[]');

function renderHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = history.map(item => `
    <div class="bg-zinc-800 p-3 rounded-2xl text-sm">
      <div class="text-xs text-zinc-400">${item.time}</div>
      <div class="line-clamp-2 mt-1">${item.text}</div>
    </div>
  `).join('');
}

function clearHistory() {
  if (confirm('Очистити історію?')) {
    history = [];
    localStorage.setItem('voicerHistory', '[]');
    renderHistory();
  }
}

function clearAll() {
  document.getElementById('textInput').value = '';
  document.getElementById('charCount').textContent = '0 / 1 000 000';
}

// ================== INIT ==================
document.addEventListener('DOMContentLoaded', () => {
  currentToken = localStorage.getItem('voicerToken') || '';
  updateTokenStatus();
  renderHistory();

  const ta = document.getElementById('textInput');
  ta.addEventListener('input', () => {
    document.getElementById('charCount').textContent = `${ta.value.length} / 1 000 000`;
  });
});
</script>
</body>
</html>
