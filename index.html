<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicer Studio | Генератор Голосу</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full space-y-6">
        <div class="text-center">
            <h1 class="text-4xl font-bold gradient-text mb-2">Voicer Studio</h1>
            <p class="text-slate-400">Перетворюйте текст у професійну озвучку миттєво</p>
        </div>

        <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Ваш текст</label>
                    <textarea id="textInput" rows="4" 
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition-all resize-none"
                        placeholder="Введіть текст для озвучення..."></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Голос</label>
                        <select id="voiceSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-sky-500">
                            <option value="uk-UA-Wavenet-A">Українська (Жіночий)</option>
                            <option value="uk-UA-Wavenet-B">Українська (Чоловічий)</option>
                            <option value="en-US-Wavenet-D">English (Male)</option>
                            <option value="en-US-Wavenet-C">English (Female)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Швидкість</label>
                        <input type="range" id="speed" min="0.25" max="4.0" step="0.1" value="1.0" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500">
                        <div class="flex justify-between text-xs text-slate-500 mt-1"><span>0.25x</span><span id="speedVal">1.0x</span><span>4x</span></div>
                    </div>
                </div>

                <button id="generateBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-4 rounded-xl flex items-center justify-center space-x-2 transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-sky-500/20">
                    <i data-lucide="mic"></i>
                    <span>Згенерувати аудіо</span>
                </button>

                <div id="resultArea" class="hidden pt-6 border-t border-slate-700 animate-fade-in">
                    <div class="flex flex-col items-center space-y-4">
                        <audio id="audioPlayer" controls class="w-full"></audio>
                        <a id="downloadLink" href="#" download="voice.mp3" class="flex items-center space-x-2 text-sky-400 hover:text-sky-300 transition-colors">
                            <i data-lucide="download" size="18"></i>
                            <span class="text-sm font-semibold">Завантажити MP3</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center px-4 text-slate-500 text-xs">
            <span class="flex items-center gap-1"><i data-lucide="zap" size="14"></i> Powered by Voicer API</span>
            <span id="charCount">0 символів</span>
        </div>
    </div>

    <script>
        // Ініціалізація іконок
        lucide.createIcons();

        const textInput = document.getElementById('textInput');
        const generateBtn = document.getElementById('generateBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        const resultArea = document.getElementById('resultArea');
        const downloadLink = document.getElementById('downloadLink');
        const speedInput = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        const charCount = document.getElementById('charCount');

        // Оновлення лічильника символів
        textInput.addEventListener('input', () => {
            charCount.textContent = `${textInput.value.length} символів`;
        });

        // Відображення швидкості
        speedInput.addEventListener('input', () => {
            speedVal.textContent = `${speedInput.value}x`;
        });

        generateBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) return alert('Будь ласка, введіть текст');

            // Зміна стану кнопки
            generateBtn.disabled = true;
            generateBtn.innerHTML = `<i data-lucide="loader-2" class="animate-spin"></i> <span>Обробка...</span>`;
            lucide.createIcons();

            try {
                // Відповідно до документації voicer.mat3u.com/docs
                // Використовуємо метод GET для простоти (багато API дозволяють це для TTS) 
                // Або POST, якщо API вимагає тіло запиту.
                const voice = document.getElementById('voiceSelect').value;
                const speed = speedInput.value;
                
                // URL для запиту (приклад структури на основі подібних API)
                // Примітка: замініть URL на конкретний ендпоінт, якщо він відрізняється
                const apiUrl = `https://voicer.mat3u.com/api/tts?text=${encodeURIComponent(text)}&voice=${voice}&speed=${speed}`;

                // В реальних умовах ми б робили fetch, але для демонстрації 
                // Voicer API зазвичай повертає прямий потік аудіо
                
                audioPlayer.src = apiUrl;
                resultArea.classList.remove('hidden');
                
                // Емуляція успішного завантаження
                audioPlayer.oncanplaythrough = () => {
                    generateBtn.disabled = false;
                    generateBtn.innerHTML = `<i data-lucide="check"></i> <span>Готово!</span>`;
                    downloadLink.href = apiUrl;
                    setTimeout(() => {
                        generateBtn.innerHTML = `<i data-lucide="mic"></i> <span>Згенерувати знову</span>`;
                        lucide.createIcons();
                    }, 3000);
                };

            } catch (error) {
                alert('Помилка при генерації. Перевірте з’єднання.');
                generateBtn.disabled = false;
                generateBtn.innerHTML = `<span>Спробувати ще раз</span>`;
            }
        });
    </script>
</body>
</html>
