<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
    .voice-item:hover { background-color: #27272a; }
    .voice-item.selected { background-color: #3b0764; border-left: 4px solid #a855f7; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">

<div class="max-w-6xl mx-auto p-6">
  <!-- HEADER -->
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-waveform text-3xl text-purple-500"></i>
      <h1 class="text-2xl font-bold tracking-tight">Voicer</h1>
    </div>
    <div onclick="showTokenModal()" class="flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 px-4 py-2 rounded-2xl cursor-pointer border border-zinc-700 transition text-sm">
      <i class="fa-solid fa-key"></i>
      <span id="tokenStatus">API токен</span>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- ЛІВА ПАНЕЛЬ: ГОЛОСИ -->
    <div class="lg:col-span-4 bg-zinc-900 rounded-3xl p-5 flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold">Голоси ElevenLabs</h2>
        <input id="voiceSearch" type="text" placeholder="Пошук..." 
               class="bg-zinc-800 text-sm rounded-2xl px-4 py-2 w-52 outline-none focus:ring-1 focus:ring-purple-500"
               onkeyup="filterVoices()">
      </div>

      <div id="voicesList" class="flex-1 overflow-y-auto pr-2 space-y-1 text-sm"></div>

      <!-- CUSTOM -->
      <div class="mt-6 pt-5 border-t border-zinc-700">
        <p class="text-xs text-zinc-400 mb-2">Custom Voice ID</p>
        <div class="flex gap-2">
          <input id="customVoiceId" type="text" placeholder="voice_id ..." 
                 class="flex-1 bg-zinc-800 rounded-2xl px-4 py-3 text-sm outline-none">
          <button onclick="useCustomVoice()" 
                  class="bg-purple-600 hover:bg-purple-700 px-5 rounded-2xl text-sm font-medium">OK</button>
        </div>
        <div id="customStatus" class="mt-2 text-xs text-emerald-400"></div>
      </div>
    </div>

    <!-- ЦЕНТР: ТЕКСТ + КНОПКА -->
    <div class="lg:col-span-5 space-y-5">
      <div class="bg-zinc-900 rounded-3xl p-6">
        <div class="flex justify-between text-sm mb-3">
          <span class="font-medium">Текст для озвучки</span>
          <span id="charCount" class="text-zinc-400">0 / 1 000 000</span>
        </div>
        <textarea id="textInput" rows="10" 
          class="w-full bg-zinc-800 rounded-2xl p-5 outline-none resize-none text-base placeholder-zinc-500"
          placeholder="Вставте або напишіть текст тут..."></textarea>
      </div>

      <button onclick="synthesize()" 
              class="w-full bg-gradient-to-r from-purple-600 to-violet-600 hover:from-purple-700 hover:to-violet-700 py-5 rounded-3xl text-xl font-semibold flex items-center justify-center gap-3 transition">
        <i class="fa-solid fa-play"></i>
        ОЗВУЧИТИ ТЕКСТ
      </button>

      <div id="status" class="text-center text-sm text-zinc-400 h-6"></div>

      <!-- ПЛЕЄР -->
      <div id="playerContainer" class="hidden bg-zinc-900 rounded-3xl p-6">
        <audio id="audioPlayer" controls class="w-full"></audio>
        <div class="flex gap-3 mt-4">
          <button onclick="downloadCurrent()" 
                  class="flex-1 py-4 bg-zinc-800 hover:bg-emerald-600 rounded-2xl flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-download"></i> Завантажити
          </button>
          <button onclick="hidePlayer()" 
                  class="flex-1 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl transition">Закрити</button>
        </div>
      </div>
    </div>

    <!-- ПРАВА ПАНЕЛЬ: НАЛАШТУВАННЯ + ІСТОРІЯ -->
    <div class="lg:col-span-3 space-y-6">
      <div class="bg-zinc-900 rounded-3xl p-5">
        <h2 class="font-semibold mb-4">Налаштування</h2>
        <div class="space-y-6 text-sm">
          <div>
            <label class="block mb-1 text-zinc-400">Модель</label>
            <select id="modelSelect" class="w-full bg-zinc-800 rounded-2xl px-4 py-3 outline-none">
              <option value="eleven_multilingual_v2">Multilingual v2 — найкраща</option>
              <option value="eleven_turbo_v2_5">Turbo v2.5 — швидка</option>
              <option value="eleven_flash_v2_5">Flash v2.5 — найшвидша</option>
            </select>
          </div>

          <div>
            <div class="flex justify-between text-xs mb-1">
              <span>Stability</span>
              <span id="stabilityVal" class="text-purple-400">0.75</span>
            </div>
            <input type="range" id="stability" min="0" max="1" step="0.05" value="0.75" class="w-full accent-purple-500">
          </div>

          <div>
            <div class="flex justify-between text-xs mb-1">
              <span>Similarity</span>
              <span id="similarityVal" class="text-purple-400">0.85</span>
            </div>
            <input type="range" id="similarity" min="0" max="1" step="0.05" value="0.85" class="w-full accent-purple-500">
          </div>

          <div class="flex items-center gap-3">
            <input type="checkbox" id="autoPause" checked class="w-4 h-4 accent-purple-500">
            <span class="text-sm">Авто-паузи</span>
            <input id="pauseDuration" type="number" value="1.2" step="0.1" class="w-20 bg-zinc-800 rounded-xl px-3 py-1 text-center text-sm">
            <span class="text-xs text-zinc-400">сек</span>
          </div>
        </div>
      </div>

      <div class="bg-zinc-900 rounded-3xl p-5 flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-semibold">Історія</h2>
          <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-300">очистити</button>
        </div>
        <div id="historyList" class="flex-1 overflow-y-auto space-y-2 text-sm"></div>
      </div>
    </div>
  </div>
</div>

<!-- TOKEN MODAL -->
<div id="tokenModal" onclick="if(event.target===this)hideTokenModal()" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div onclick="event.stopImmediatePropagation()" class="bg-zinc-900 rounded-3xl p-8 w-full max-w-md">
    <h3 class="text-xl font-semibold mb-6">Введіть API токен</h3>
    <input id="tokenInput" type="password" placeholder="sk_..." class="w-full bg-zinc-800 rounded-2xl px-5 py-4 outline-none mb-6">
    <button onclick="saveToken()" class="w-full py-4 bg-purple-600 hover:bg-purple-700 rounded-2xl font-medium">Зберегти</button>
  </div>
</div>

<script>
// ================== ДАНІ ==================
const API_BASE = "https://voicer.mat3u.com/api/v1";

const voicesDB = [
  {id:"21m00Tcm4TlvDq8ikWAM", name:"Rachel", desc:"Жіночий класичний"},
  {id:"EXAVITQu4vr4xnSDxMaL", name:"Bella", desc:"Теплий жіночий"},
  {id:"ErXwobaYiN019PkySvjV", name:"Antoni", desc:"Енергійний чоловічий"},
  {id:"pNInz6obpgDQGcFmaJgB", name:"Adam", desc:"Глибокий чоловічий"},
  {id:"AZnzlk1XvdvUeBnXmlld", name:"Domi", desc:"Динамічна жіноча"},
  {id:"VR6AewLTigWG4xSOukaG", name:"Arnold", desc:"Сильний чоловічий"},
  {id:"yoZ06aMxZJJ28mfd3POQ", name:"Sam", desc:"Дружній чоловічий"},
  {id:"ThT5KcBeYPXvke4nZqZf", name:"Grace", desc:"Ніжна жіноча"},
  {id:"Xb7hH8MSUJpSbSDYk0k2", name:"Alice", desc:"Британська жіноча"},
  {id:"iP95p4xoKVk53GoZ742B", name:"Chris", desc:"Спокійний чоловічий"},
  {id:"2EiwWnXFnvU5JabPnv8n", name:"Clyde", desc:"Низький чоловічий"},
  {id:"XB0fDUnXU5powFXDhCwa", name:"Charlotte", desc:"Британська жіноча"},
  {id:"MF3mGyEYCl7XYWbV9V6O", name:"Elli", desc:"Молода жіноча"},
  {id:"N2lVS1w4EtoT3dr4eOWO", name:"Daniel", desc:"Британський чоловічий"},
];

let currentToken = '';
let history = [];
let currentTaskId = null;
let currentBlobUrl = null;
let selectedVoice = voicesDB[0];
let customVoice = null;

// ================== РЕНДЕР СПИСКУ ГОЛОСІВ ==================
function renderVoices(filtered) {
  const container = document.getElementById('voicesList');
  container.innerHTML = '';
  filtered.forEach(v => {
    const isSelected = (customVoice && v.id === customVoice.id) || (!customVoice && v.id === selectedVoice.id);
    const div = document.createElement('div');
    div.className = `voice-item px-4 py-3 rounded-2xl cursor-pointer flex justify-between items-center ${isSelected ? 'selected' : ''}`;
    div.innerHTML = `
      <div>
        <div class="font-medium">${v.name}</div>
        <div class="text-xs text-zinc-400">${v.desc}</div>
      </div>
      <div class="text-[10px] font-mono text-purple-400/60">${v.id.slice(0,8)}…</div>
    `;
    div.onclick = () => {
      customVoice = null;
      selectedVoice = v;
      document.getElementById('customStatus').innerHTML = '';
      renderVoices(filtered);
    };
    container.appendChild(div);
  });
}

function filterVoices() {
  const term = document.getElementById('voiceSearch').value.toLowerCase();
  const filtered = voicesDB.filter(v => 
    v.name.toLowerCase().includes(term) || v.desc.toLowerCase().includes(term) || v.id.toLowerCase().includes(term)
  );
  renderVoices(filtered);
}

function useCustomVoice() {
  const id = document.getElementById('customVoiceId').value.trim();
  if (!id) return;
  customVoice = {id, name: "Custom", desc: "Власний голос"};
  selectedVoice = customVoice;
  document.getElementById('customStatus').innerHTML = `Використовується: <span class="font-mono">${id}</span>`;
  renderVoices(voicesDB);
}

// ================== ТОКЕН ==================
function updateTokenStatus() {
  document.getElementById('tokenStatus').innerHTML = currentToken 
    ? `✅ Підключено` 
    : `🔑 Токен`;
}

function showTokenModal() {
  document.getElementById('tokenModal').classList.remove('hidden');
}

function hideTokenModal() {
  document.getElementById('tokenModal').classList.add('hidden');
}

function saveToken() {
  currentToken = document.getElementById('tokenInput').value.trim();
  hideTokenModal();
  updateTokenStatus();
}

// ================== СИНТЕЗ + ПЛЕЄР + ІСТОРІЯ (без змін) ==================
async function synthesize() { /* ... той самий код з попередньої версії ... */ 
  // (я не повторюю його повністю, щоб не роздувати повідомлення — він ідентичний попередньому)
  if (!currentToken) return alert('Введіть API токен!');
  const text = document.getElementById('textInput').value.trim();
  if (!text) return alert('Введіть текст!');

  document.getElementById('status').innerHTML = 'Створюємо озвучку...';

  const body = {
    text,
    voice_id: selectedVoice.id,
    model_id: document.getElementById('modelSelect').value,
    auto_pause_enabled: document.getElementById('autoPause').checked,
    auto_pause_duration: parseFloat(document.getElementById('pauseDuration').value) || 1.2,
    voice_settings: {
      stability: parseFloat(document.getElementById('stability').value),
      similarity_boost: parseFloat(document.getElementById('similarity').value)
    }
  };

  try {
    const res = await fetch(`${API_BASE}/voice/synthesize`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    currentTaskId = data.task_id;
    startPolling();
  } catch(e) {
    document.getElementById('status').innerHTML = 'Помилка запиту';
  }
}

function startPolling() { /* ... той самий ... */ }
async function playAudio(taskId, voiceName) { /* ... той самий ... */ }
function downloadCurrent() { /* ... */ }
function hidePlayer() { /* ... */ }
function clearAll() { /* ... */ }
function renderHistory() { /* ... */ }
async function replayHistory(index) { /* ... */ }
function clearHistory() { /* ... */ }

// ================== ІНІЦІАЛІЗАЦІЯ ==================
document.addEventListener('DOMContentLoaded', () => {
  updateTokenStatus();
  renderVoices(voicesDB);
  renderHistory();

  const ta = document.getElementById('textInput');
  ta.addEventListener('input', () => {
    document.getElementById('charCount').textContent = `${ta.value.length} / 1 000 000`;
  });

  // слайдери
  document.getElementById('stability').oninput = () => {
    document.getElementById('stabilityVal').textContent = parseFloat(this.value).toFixed(2);
  };
  document.getElementById('similarity').oninput = () => {
    document.getElementById('similarityVal').textContent = parseFloat(this.value).toFixed(2);
  };
});
</script>
</body>
</html>
