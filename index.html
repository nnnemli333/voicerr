<script>
// ... (весь попередній код залишається, заміни тільки ці функції)

function showCreateTemplateModal() {
  const modal = document.getElementById('templateModal');
  modal.classList.remove('hidden');
  document.getElementById('templateName').focus();
  
  // Автозаповнення назви, якщо текст вже є
  const currentText = document.getElementById('textInput').value.trim();
  if (currentText.length > 10) {
    document.getElementById('templateName').placeholder = "Наприклад: Новини, Оголошення, Книга...";
  }
}

function createTemplate() {
  const nameInput = document.getElementById('templateName');
  const name = nameInput.value.trim();
  
  if (!name) {
    nameInput.classList.add('!border-red-500');
    nameInput.placeholder = "Введіть назву шаблону!";
    setTimeout(() => {
      nameInput.classList.remove('!border-red-500');
    }, 1500);
    return;
  }

  const text = document.getElementById('textInput').value.trim();
  
  if (!text) {
    addLog('Помилка: спочатку напишіть текст для озвучки', 'error');
    alert('Спочатку введіть текст у головне поле!');
    document.getElementById('templateModal').classList.add('hidden');
    return;
  }

  // Створюємо шаблон
  templates.unshift({ 
    name: name, 
    text: text,
    date: new Date().toISOString()
  });

  localStorage.setItem('voicerTemplates', JSON.stringify(templates));
  
  // Закриваємо модалку
  document.getElementById('templateModal').classList.add('hidden');
  nameInput.value = '';

  // Оновлюємо список
  renderTemplates();
  
  addLog(`Шаблон "${name}" успішно створено`, 'success');
}

function useTemplate(i) {
  if (!templates[i]) return;
  
  document.getElementById('textInput').value = templates[i].text;
  document.getElementById('charCount').textContent = 
    `${templates[i].text.length} / 1 000 000`;
  
  addLog(`Завантажено шаблон: ${templates[i].name}`, 'success');
  
  // Прокручуємо до текстового поля
  document.getElementById('textInput').scrollIntoView({ behavior: "smooth" });
}

// ================== renderTemplates (оновлена, з датою) ==================
function renderTemplates() {
  const container = document.getElementById('templatesList');
  container.innerHTML = '';

  if (templates.length === 0) {
    container.innerHTML = `
      <div class="text-zinc-500 text-sm py-10 text-center border border-dashed border-zinc-700 rounded-2xl">
        Ще немає шаблонів<br>
        <span class="text-xs">Натисніть «Новий» щоб створити</span>
      </div>`;
    return;
  }

  templates.forEach((tmpl, i) => {
    const div = document.createElement('div');
    div.className = `group bg-zinc-950 hover:bg-zinc-900 border border-zinc-700 hover:border-[#00ff9d33] rounded-2xl p-4 cursor-pointer transition-all duration-200`;
    
    div.innerHTML = `
      <div class="flex justify-between items-start">
        <div class="flex-1 min-w-0">
          <div class="font-medium text-white group-hover:text-[#00ff9d] transition">${tmpl.name}</div>
          <div class="text-xs text-zinc-500 mt-1 line-clamp-2">${tmpl.text.substring(0, 85)}${tmpl.text.length > 85 ? '...' : ''}</div>
        </div>
        <button onclick="event.stopImmediatePropagation(); useTemplate(${i});" 
                class="ml-3 text-2xl text-[#00ff9d] opacity-60 hover:opacity-100 transition">▶</button>
      </div>
    `;
    
    div.onclick = () => useTemplate(i);
    container.appendChild(div);
  });
}

// ... решта коду (synthesize, addLog тощо) залишається без змін
</script>
