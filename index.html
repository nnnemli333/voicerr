<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicer Green — ElevenLabs Custom ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .emerald-shadow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.1); }
        input[type="range"]::-webkit-slider-thumb { background: #10b981; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<div class="max-w-6xl mx-auto p-4 md:p-8">
    <div class="flex flex-col md:flex-row items-center justify-between mb-10 gap-4">
        <div class="flex items-center gap-4">
            <div class="bg-emerald-500 p-3 rounded-2xl shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-waveform-lines text-2xl text-zinc-950"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-tight">VOICER <span class="text-emerald-500">PRO</span></h1>
                <p class="text-zinc-500 text-sm">ElevenLabs via mat3u API</p>
            </div>
        </div>
        
        <div onclick="showTokenModal()" class="group flex items-center gap-3 bg-zinc-900 hover:bg-emerald-900/20 border border-zinc-800 hover:border-emerald-500/50 px-6 py-3 rounded-2xl cursor-pointer transition-all">
            <i class="fa-solid fa-key text-emerald-500 group-hover:rotate-12 transition-transform"></i>
            <span id="tokenStatus" class="text-sm font-semibold">Налаштувати API</span>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800 emerald-shadow">
                <h2 class="text-lg font-bold mb-5 flex items-center gap-2 text-emerald-400">
                    <i class="fa-solid fa-fingerprint"></i> Голос (Voice ID)
                </h2>
                <input id="voiceId" type="text" placeholder="Вставте Voice ID тут..." 
                       class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 transition-colors text-emerald-500 font-mono text-sm"
                       value="pNInz6obpgDQGcFmaJgB">
                <p class="text-[10px] text-zinc-500 mt-2">Візьміть ID у своєму кабінеті ElevenLabs</p>
            </div>

            <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800">
                <h2 class="text-lg font-bold mb-5 text-emerald-400 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> Параметри
                </h2>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-500 mb-3">Модель генерації</label>
                        <select id="modelSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 outline-none focus:border-emerald-500">
                            <option value="eleven_multilingual_v2">🌍 Multilingual v2 (Якість)</option>
                            <option value="eleven_turbo_v2_5" selected>⚡ Turbo v2.5 (Швидкість)</option>
                            <option value="eleven_flash_v2_5">🚀 Flash v2.5 (Економія)</option>
                        </select>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-sm">Stability</label>
                                <span id="stabilityVal" class="text-emerald-400 font-mono">0.50</span>
                            </div>
                            <input type="range" id="stability" min="0" max="1" step="0.01" value="0.50" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                        </div>

                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-sm">Similarity Boost</label>
                                <span id="similarityVal" class="text-emerald-400 font-mono">0.75</span>
                            </div>
                            <input type="range" id="similarity" min="0" max="1" step="0.01" value="0.75" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                        </div>

                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-sm">Style Exaggeration</label>
                                <span id="styleVal" class="text-emerald-400 font-mono">0.00</span>
                            </div>
                            <input type="range" id="style" min="0" max="1" step="0.01" value="0" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                        </div>
                    </div>

                    <label class="flex items-center gap-3 p-3 bg-zinc-950 rounded-xl cursor-pointer hover:bg-zinc-800 transition-colors">
                        <input type="checkbox" id="speakerBoost" checked class="w-5 h-5 accent-emerald-500">
                        <span class="text-sm">Speaker Boost (Рекомендовано)</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 space-y-6">
            <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-bold uppercase text-zinc-500 tracking-widest">Текст для озвучки</span>
                    <span id="charCount" class="bg-zinc-950 px-3 py-1 rounded-full text-[10px] font-mono border border-zinc-800">0 / 5000</span>
                </div>
                <textarea id="textInput" rows="12" 
                    class="w-full bg-transparent text-xl leading-relaxed outline-none resize-none placeholder-zinc-700" 
                    placeholder="Введіть текст, який потрібно перетворити на голос..."></textarea>
            </div>

            <div class="grid grid-cols-4 gap-4">
                <button onclick="synthesize()" class="col-span-3 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 py-5 rounded-2xl font-black text-xl transition-all active:scale-95 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-bolt-lightning"></i> ЗГЕНЕРУВАТИ АУДІО
                </button>
                <button onclick="clearText()" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-2xl transition-all flex items-center justify-center">
                    <i class="fa-solid fa-trash-can text-zinc-500"></i>
                </button>
            </div>

            <div id="playerContainer" class="hidden bg-emerald-500 rounded-3xl p-6 text-zinc-950">
                <div class="flex items-center gap-4">
                    <button id="playBtn" class="bg-zinc-950 text-emerald-500 w-12 h-12 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-play ml-1"></i>
                    </button>
                    <audio id="audioPlayer" controls class="hidden"></audio>
                    <div class="flex-1">
                        <p class="font-bold text-sm">Аудіо готове!</p>
                        <p id="audioMeta" class="text-xs opacity-70">Model: v2.5 Turbo</p>
                    </div>
                    <button onclick="downloadAudio()" class="bg-zinc-950/10 hover:bg-zinc-950/20 p-4 rounded-xl transition-colors">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>

            <div id="status" class="text-center text-sm font-medium text-zinc-500 italic"></div>
        </div>
    </div>
</div>

<div id="tokenModal" onclick="if(event.target===this)hideTokenModal()" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50">
    <div onclick="event.stopImmediatePropagation()" class="bg-zinc-900 border border-zinc-800 rounded-[2rem] p-8 w-full max-w-md shadow-2xl">
        <h3 class="text-2xl font-bold mb-2">API Ключ</h3>
        <p class="text-zinc-500 text-sm mb-6">Ваш токен зберігається лише локально у вашому браузері.</p>
        <input id="tokenInput" type="password" placeholder="sk_..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-5 py-4 text-lg outline-none mb-6 focus:border-emerald-500">
        <button onclick="saveToken()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 py-4 text-lg font-bold rounded-xl transition-all">Зберегти</button>
    </div>
</div>

<script>
let currentApiKey = localStorage.getItem('elevenlabs_key') || '';
let audioUrl = null;

// UI Updates
const updateStatus = (msg) => document.getElementById('status').innerText = msg;

function showTokenModal() { document.getElementById('tokenModal').classList.remove('hidden'); }
function hideTokenModal() { document.getElementById('tokenModal').classList.add('hidden'); }

function saveToken() {
    const val = document.getElementById('tokenInput').value.trim();
    if(val) {
        localStorage.setItem('elevenlabs_key', val);
        currentApiKey = val;
        updateTokenStatus();
        hideTokenModal();
    }
}

function updateTokenStatus() {
    const status = document.getElementById('tokenStatus');
    if(currentApiKey) {
        status.innerHTML = `Ключ: <span class="text-emerald-400 font-mono">${currentApiKey.substring(0,6)}***</span>`;
    } else {
        status.innerHTML = `<span class="text-red-400">Вкажіть API токен</span>`;
    }
}

function clearText() {
    document.getElementById('textInput').value = '';
    document.getElementById('charCount').innerText = '0 / 5000';
}

async function synthesize() {
    const text = document.getElementById('textInput').value.trim();
    const voiceId = document.getElementById('voiceId').value.trim();
    const model = document.getElementById('modelSelect').value;

    if (!currentApiKey) return showTokenModal();
    if (!text) return updateStatus('❌ Будь ласка, введіть текст');
    if (!voiceId) return updateStatus('❌ Будь ласка, вкажіть Voice ID');

    updateStatus('⏳ Обробка запиту через Voicer API...');
    
    const settings = {
        stability: parseFloat(document.getElementById('stability').value),
        similarity_boost: parseFloat(document.getElementById('similarity').value),
        style: parseFloat(document.getElementById('style').value),
        use_speaker_boost: document.getElementById('speakerBoost').checked
    };

    try {
        const response = await fetch(`https://voicer.mat3u.com/api/v1/text-to-speech/${voiceId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'xi-api-key': currentApiKey
            },
            body: JSON.stringify({
                text: text,
                model_id: model,
                voice_settings: settings
            })
        });

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail?.message || 'Помилка API');
        }

        const blob = await response.blob();
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = URL.createObjectURL(blob);
        
        const player = document.getElementById('audioPlayer');
        player.src = audioUrl;
        
        document.getElementById('playerContainer').classList.remove('hidden');
        document.getElementById('audioMeta').innerText = `Model: ${model} | ID: ${voiceId.substring(0,8)}...`;
        updateStatus('✅ Готово!');
        
        document.getElementById('playBtn').onclick = () => player.play();
    } catch (e) {
        updateStatus(`❌ Помилка: ${e.message}`);
    }
}

function downloadAudio() {
    if (!audioUrl) return;
    const a = document.createElement('a');
    a.href = audioUrl;
    a.download = `voicer_${Date.now()}.mp3`;
    a.click();
}

// Sliders UI
document.querySelectorAll('input[type="range"]').forEach(input => {
    input.oninput = () => {
        document.getElementById(`${input.id}Val`).innerText = parseFloat(input.value).toFixed(2);
    };
});

// Char count
document.getElementById('textInput').oninput = (e) => {
    document.getElementById('charCount').innerText = `${e.target.value.length} / 5000`;
};

// Init
document.addEventListener('DOMContentLoaded', () => {
    updateTokenStatus();
    if(currentApiKey) document.getElementById('tokenInput').value = currentApiKey;
});
</script>
</body>
</html>
