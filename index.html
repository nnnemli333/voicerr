<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; }
    .hacker-green { color: #00ff9d; }
    .accent-hacker { accent-color: #00ff9d; }
    .btn-hacker { background: #00ff9d; color: #000; font-weight: 600; }
    .btn-hacker:hover { background: #00cc7a; box-shadow: 0 0 20px #00ff9d88; }
    .btn-disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .modal { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">
<div class="max-w-7xl mx-auto p-6">

  <!-- HEADER -->
  <div class="flex items-center justify-between mb-8 border-b border-zinc-800 pb-6">
    <div class="flex items-center gap-4">
      <i class="fa-solid fa-waveform text-4xl hacker-green"></i>
      <h1 class="text-3xl font-bold tracking-tight text-white">Voicer</h1>
    </div>
    <div onclick="showTokenModal()" class="cursor-pointer flex items-center gap-3 bg-zinc-900 hover:bg-zinc-800 px-6 py-3 rounded-2xl border border-[#00ff9d33]">
      <i class="fa-solid fa-key hacker-green"></i>
      <span id="tokenStatus" class="font-medium">API токен</span>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-6">
    <!-- ШАБЛОНИ -->
    <div class="col-span-12 lg:col-span-3 bg-zinc-900 rounded-3xl p-6 border border-[#00ff9d33]">
      <div class="flex justify-between items-center mb-5">
        <h2 class="font-semibold text-lg flex items-center gap-2 hacker-green"><i class="fa-solid fa-bookmark"></i> Мої шаблони голосу</h2>
        <button onclick="showCreateTemplateModal()" class="hacker-green hover:text-white flex items-center gap-1 text-sm"><i class="fa-solid fa-plus"></i> Новий</button>
      </div>
      <div id="templatesList" class="space-y-2 max-h-96 overflow-y-auto"></div>
    </div>

    <!-- ТЕКСТ -->
    <div class="col-span-12 lg:col-span-6">
      <div class="bg-zinc-900 rounded-3xl p-7 border border-[#00ff9d33]">
        <div class="flex justify-between mb-4 text-sm">
          <span class="text-zinc-300">Текст для озвучки</span>
          <span id="charCount" class="text-zinc-500">0 / 1 000 000</span>
        </div>
        <textarea id="textInput" rows="11" class="w-full bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl p-6 outline-none text-base resize-none" placeholder="Вставте або напишіть текст..."></textarea>
      </div>

      <button id="synthesizeBtn" onclick="synthesize()" 
              class="mt-6 w-full py-6 text-xl font-semibold btn-hacker rounded-3xl flex items-center justify-center gap-3">
        <i class="fa-solid fa-play"></i> 
        <span id="btnText">ОЗВУЧИТИ ТЕКСТ</span>
      </button>
    </div>

    <!-- НАЛАШТУВАННЯ (без змін) -->
    <div class="col-span-12 lg:col-span-3 bg-zinc-900 rounded-3xl p-6 space-y-6 border border-[#00ff9d33]">
      <!-- ... (весь блок налаштувань залишився той самий як у попередній версії) ... -->
      <h2 class="font-semibold text-lg mb-2 hacker-green">Налаштування</h2>
      <div>
        <label class="block text-xs text-zinc-400 mb-2">МОДЕЛЬ</label>
        <select id="modelSelect" class="w-full bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl px-5 py-4 outline-none text-sm">
          <option value="eleven_multilingual_v2">Multilingual v2 (рекомендовано)</option>
          <option value="eleven_turbo_v2_5">Turbo v2.5</option>
          <option value="eleven_flash_v2_5">Flash v2.5</option>
          <option value="eleven_v3">v3</option>
        </select>
      </div>
      <div class="space-y-5">
        <div><div class="flex justify-between text-xs mb-1"><span>Stability</span><span id="stabilityVal" class="hacker-green">0.75</span></div><input type="range" id="stability" min="0" max="1" step="0.01" value="0.75" class="w-full accent-hacker"></div>
        <div><div class="flex justify-between text-xs mb-1"><span>Similarity</span><span id="similarityVal" class="hacker-green">0.85</span></div><input type="range" id="similarity" min="0" max="1" step="0.01" value="0.85" class="w-full accent-hacker"></div>
        <div><div class="flex justify-between text-xs mb-1"><span>Style</span><span id="styleVal" class="hacker-green">0.10</span></div><input type="range" id="style" min="0" max="1" step="0.01" value="0.10" class="w-full accent-hacker"></div>
      </div>
      <div class="pt-4 border-t border-zinc-700 flex flex-col gap-4 text-sm">
        <label class="flex items-center gap-3"><input type="checkbox" id="speakerBoost" checked class="w-5 h-5 accent-hacker"> Speaker Boost</label>
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-3"><input type="checkbox" id="autoPause" checked class="w-5 h-5 accent-hacker"> Авто-паузи</label>
          <input id="pauseDuration" type="number" value="1.2" step="0.1" class="w-20 bg-zinc-950 border border-zinc-700 rounded-3xl px-4 py-2 text-center">
          <span class="text-xs text-zinc-400">сек</span>
        </div>
      </div>
      <div class="pt-6 border-t border-zinc-700">
        <p class="text-xs text-zinc-400 mb-2">VOICE ID</p>
        <div class="flex gap-2">
          <input id="voiceIdInput" type="text" placeholder="Встав voice_id сюди" class="flex-1 bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl px-5 py-4 text-sm outline-none">
          <button onclick="setVoiceId()" class="btn-hacker px-6 rounded-3xl text-sm">OK</button>
        </div>
        <div id="currentVoice" class="mt-3 text-xs hacker-green font-mono break-all"></div>
      </div>
    </div>
  </div>

  <!-- PLAYER PANEL (з індикатором генерації) -->
  <div id="playerPanel" class="hidden mt-8 bg-zinc-900 rounded-3xl p-6 border border-[#00ff9d33]">
    <div class="flex justify-between mb-4">
      <h3 class="font-medium hacker-green flex items-center gap-2"><i id="playerIcon" class="fa-solid fa-spinner fa-spin"></i> <span id="playerTitle">Генерація аудіо...</span></h3>
      <button onclick="hidePlayer()" class="text-xs text-zinc-400 hover:text-red-400">закрити</button>
    </div>
    <div id="processingBlock" class="text-center py-8 text-emerald-400 flex flex-col items-center gap-3">
      <i class="fa-solid fa-spinner fa-spin text-4xl"></i>
      <p class="text-lg">Йде генерація аудіо...</p>
      <p id="progressText" class="text-sm text-zinc-400">0% • чекаємо сервер</p>
    </div>
    <div id="readyBlock" class="hidden">
      <audio id="audioPlayer" controls class="w-full"></audio>
      <div class="flex justify-between items-center mt-4">
        <span id="audioDuration" class="font-mono text-sm text-zinc-400"></span>
        <button onclick="downloadAudio()" class="btn-hacker px-8 py-3 rounded-3xl flex items-center gap-2">
          <i class="fa-solid fa-download"></i> Завантажити MP3
        </button>
      </div>
    </div>
  </div>

  <!-- LOG -->
  <div class="mt-8 bg-zinc-900 rounded-3xl p-6 border border-[#00ff9d33]">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-medium hacker-green flex items-center gap-2"><i class="fa-solid fa-terminal"></i> ЛОГ</h3>
      <button onclick="clearLogs()" class="text-xs text-zinc-400 hover:text-red-400">очистити</button>
    </div>
    <div id="logContainer" class="h-56 overflow-y-auto bg-black/70 rounded-2xl p-5 text-xs hacker-green log-line space-y-1"></div>
  </div>
</div>

<!-- MODALS (без змін) -->
<div id="tokenModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
  <div class="modal bg-zinc-900 rounded-3xl p-8 w-full max-w-md border border-[#00ff9d33] relative">
    <button onclick="closeModal('tokenModal')" class="absolute top-4 right-4 text-3xl text-zinc-400 hover:text-white">×</button>
    <h3 class="text-xl font-semibold mb-6 hacker-green">API токен</h3>
    <input id="tokenInput" type="password" placeholder="sk_..." class="w-full bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl px-6 py-5 outline-none">
    <button onclick="saveToken()" class="mt-6 w-full py-5 btn-hacker rounded-3xl font-medium">Зберегти</button>
  </div>
</div>

<div id="templateModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
  <div class="modal bg-zinc-900 rounded-3xl p-8 w-full max-w-md border border-[#00ff9d33] relative">
    <button onclick="closeModal('templateModal')" class="absolute top-4 right-4 text-3xl text-zinc-400 hover:text-white">×</button>
    <h3 class="text-xl font-semibold mb-6 hacker-green">Новий шаблон голосу</h3>
    <input id="templateName" placeholder="Назва шаблону" class="w-full bg-zinc-950 border border-zinc-700 focus:border-[#00ff9d] rounded-3xl px-6 py-5 outline-none mb-6">
    <button onclick="createTemplate()" class="w-full py-5 btn-hacker rounded-3xl font-medium">Зберегти шаблон</button>
  </div>
</div>

<script>
// ================== ЗМІННІ ==================
const API_BASE = "https://voicer.mat3u.com/api/v1";
let currentToken = '';
let currentVoiceId = '';
let templates = [];
let logs = [];
let currentTaskId = null;
let currentAudioUrl = null;
let pollingInterval = null;

// Завантаження
try {
  currentToken = localStorage.getItem('voicerToken') || '';
  const saved = localStorage.getItem('voicerTemplates');
  if (saved) templates = JSON.parse(saved);
} catch (e) {}

// ================== LOG ==================
function addLog(message, type = 'info') {
  const time = new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const color = type === 'error' ? 'text-red-400' : 'hacker-green';
  logs.push(`<span class="text-zinc-500">[${time}]</span> <span class="${color}">${message}</span>`);
  if (logs.length > 50) logs.shift();
  document.getElementById('logContainer').innerHTML = logs.join('<br>');
  document.getElementById('logContainer').scrollTop = 999999;
}

function clearLogs() {
  logs = [];
  document.getElementById('logContainer').innerHTML = '';
  addLog('Лог очищено', 'info');
}

// ================== МОДАЛКИ + ТОКЕН ==================
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function showTokenModal() { closeModal('templateModal'); document.getElementById('tokenModal').classList.remove('hidden'); }
function showCreateTemplateModal() { closeModal('tokenModal'); document.getElementById('templateModal').classList.remove('hidden'); document.getElementById('templateName').focus(); }

function updateTokenStatus() {
  const statusEl = document.getElementById('tokenStatus');
  statusEl.innerHTML = currentToken && currentToken.length > 10 
    ? `<span class="hacker-green">✅ Підключено</span>` 
    : `🔑 Токен`;
}
function saveToken() {
  currentToken = document.getElementById('tokenInput').value.trim();
  try { localStorage.setItem('voicerToken', currentToken); } catch(e){}
  closeModal('tokenModal');
  updateTokenStatus();
  addLog('Токен збережено', 'success');
}

// ================== ШАБЛОНИ (залишилось як було) ==================
function saveTemplates() { try { localStorage.setItem('voicerTemplates', JSON.stringify(templates)); } catch(e){} }
function renderTemplates() { /* ... той самий код як у попередній версії ... */ } // (скорочено для економії місця — скопіюй з попереднього повідомлення)
function createTemplate() { /* ... той самий код ... */ }
function deleteTemplate(i) { /* ... той самий код ... */ }
function useTemplate(i) { /* ... той самий код ... */ }
function setVoiceId() { /* ... той самий код ... */ }

// ================== СИНТЕЗ + ВІЗУАЛЬНИЙ ФІДБЕК ==================
async function synthesize() {
  const btn = document.getElementById('synthesizeBtn');
  const btnText = document.getElementById('btnText');

  if (!currentToken) return alert('Введіть API токен!');
  if (!currentVoiceId) return alert('Вкажіть Voice ID!');
  const text = document.getElementById('textInput').value.trim();
  if (!text) return alert('Введіть текст!');

  // === ВІЗУАЛЬНИЙ ФІДБЕК ===
  btn.disabled = true;
  btn.classList.add('btn-disabled');
  btnText.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>Генерація...`;

  document.getElementById('playerPanel').classList.remove('hidden');
  document.getElementById('readyBlock').classList.add('hidden');
  document.getElementById('processingBlock').classList.remove('hidden');
  document.getElementById('playerTitle').textContent = 'Генерація аудіо...';

  addLog('Створюємо задачу...', 'info');

  const body = { /* ... той самий body як раніше ... */ };

  try {
    const res = await fetch(`${API_BASE}/voice/synthesize`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (data.task_id) {
      currentTaskId = data.task_id;
      addLog(`Задача створена • Task ID: ${data.task_id}`, 'success');
      startPolling(data.task_id);
    }
  } catch (e) {
    addLog(`Помилка: ${e.message}`, 'error');
    resetButton();
  }
}

function startPolling(task_id) {
  if (pollingInterval) clearInterval(pollingInterval);
  pollingInterval = setInterval(async () => {
    try {
      const res = await fetch(`${API_BASE}/voice/status/${task_id}`, {
        headers: { 'Authorization': `Bearer ${currentToken}` }
      });
      const data = await res.json();

      if (data.status === 'completed') {
        clearInterval(pollingInterval);
        resetButton();
        loadAndPlayAudio(task_id);
      } else if (data.status === 'censored' || data.status === 'failed') {
        clearInterval(pollingInterval);
        resetButton();
        addLog('Помилка або цензура', 'error');
        document.getElementById('playerPanel').classList.add('hidden');
      }
    } catch (e) {}
  }, 1400);
}

async function loadAndPlayAudio(task_id) {
  try {
    const res = await fetch(`${API_BASE}/voice/download/${task_id}`, {
      headers: { 'Authorization': `Bearer ${currentToken}` }
    });
    const blob = await res.blob();
    currentAudioUrl = URL.createObjectURL(blob);

    document.getElementById('processingBlock').classList.add('hidden');
    document.getElementById('readyBlock').classList.remove('hidden');
    document.getElementById('playerTitle').innerHTML = `<i class="fa-solid fa-check-circle"></i> Готово!`;

    const player = document.getElementById('audioPlayer');
    player.src = currentAudioUrl;

    const audio = new Audio(currentAudioUrl);
    audio.onloadedmetadata = () => {
      const min = Math.floor(audio.duration / 60);
      const sec = Math.floor(audio.duration % 60);
      document.getElementById('audioDuration').textContent = `Тривалість: ${min}:${sec < 10 ? '0' : ''}${sec}`;
    };
  } catch (e) {
    addLog('Не вдалося завантажити аудіо', 'error');
  }
}

function resetButton() {
  const btn = document.getElementById('synthesizeBtn');
  const btnText = document.getElementById('btnText');
  btn.disabled = false;
  btn.classList.remove('btn-disabled');
  btnText.innerHTML = `<i class="fa-solid fa-play"></i> ОЗВУЧИТИ ТЕКСТ`;
}

function downloadAudio() {
  if (!currentAudioUrl) return;
  const a = document.createElement('a');
  a.href = currentAudioUrl;
  a.download = `voicer_${Date.now()}.mp3`;
  a.click();
}

function hidePlayer() {
  document.getElementById('playerPanel').classList.add('hidden');
  if (pollingInterval) clearInterval(pollingInterval);
  resetButton();
}

// ================== INIT ==================
document.addEventListener('DOMContentLoaded', () => {
  updateTokenStatus();
  renderTemplates();
  addLog('Voicer запущено', 'success');

  // решта init (charCount, sliders, ESC) — як раніше
});
</script>
</body>
</html>
